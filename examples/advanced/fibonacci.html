}

.output-line{
  color:#00ff41;
}
.output-line:before{
  content:"→ ";
  color:#00ff41;
  opacity:0.3;
}

  color:#00ff41;
  font-weight:bold;
  text-shadow:0 0 30px rgba(0,255,65,0.15);

  content:"";

  letter-spacing:2px;
  opacity:0.5;
}
.divider:before{
  content:"";
}

.error:before{

  color:#ff3333;
