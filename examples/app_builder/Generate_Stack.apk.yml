# ╔══════════════════════════════════════════════════════════════╗
# ║        Generate_Stack.apk.yml — VCG App Build Stack         ║
# ║  ضع هذا الملف في مجلد مشروعك وافتحه في VCG Editor          ║
# ║  عند تشغيل هذا الملف تبدأ عملية بناء APK+ZIP+PDF           ║
# ╚══════════════════════════════════════════════════════════════╝

# ─── إعدادات التطبيق ────────────────────────────────────────────
app:
  name:    "تطبيقي الأول"
  package: "com.example.myapp"
  version: "1.0.0"
  icon:    "assets/icon.png"

# ─── ملفات المصدر الرئيسية (VCG) ────────────────────────────────
sources:
  entry: "main.vcg"
  files:
    - "main.vcg"
    - "data/data_store.vcg"

# ─── المخرجات المطلوبة ──────────────────────────────────────────
outputs:
  apk:  true          # ينشئ APK
  zip:  true          # ينشئ ZIP يحتوي على المشروع كاملاً
  pdf:  true          # ينشئ PDF وثائق التطبيق

# ─── إعدادات Android ────────────────────────────────────────────
android:
  min_sdk:    21
  target_sdk: 34
  compile_sdk: 34

# ─── اسم الإصدار ─────────────────────────────────────────────────
build:
  type:    "debug"     # debug أو release
  sign:    false
  verbose: true
