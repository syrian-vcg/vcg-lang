<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VCG Terminal</title>
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #33ff33;
            font-family: 'JetBrains Mono', 'Cairo', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.2rem 1rem;
            margin: 0;
        }

        /* ── terminal container ── */
        .terminal {
            width: 100%;
            max-width: 920px;
            background: #000;
            border: 1px solid #1a3a1a;
            border-radius: 10px;
            padding: 1.6rem 1.8rem;
            min-height: 92vh;
            box-shadow: 0 0 48px rgba(0, 255, 0, 0.04), inset 0 0 60px rgba(0, 255, 0, 0.02);
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ── subtle scanline overlay ── */
        .terminal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 255, 0, 0.015) 0px,
                    rgba(0, 255, 0, 0.015) 2px,
                    transparent 2px,
                    transparent 6px);
            pointer-events: none;
            border-radius: 10px;
            z-index: 0;
        }

        /* ── output lines ── */
        #out {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.75;
            color: #33ff33;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .ln {
            display: block;
            padding: 0.05rem 0.2rem;
            border-radius: 2px;
            transition: background 0.1s;
            position: relative;
        }

        .ln::before {
            content: '❯ ';
            color: #1a6b1a;
            font-weight: 400;
            opacity: 0.6;
            user-select: none;
        }

        .ln:hover {
            background: rgba(51, 255, 51, 0.035);
        }

        /* ── error lines ── */
        .err {
            color: #ff6b6b;
        }
        .err::before {
            content: '✗ ';
            color: #ff6b6b;
            opacity: 0.8;
        }

        /* ── code blocks ── */
        .code-block {
            display: block;
            background: #0a1a0a;
            border-right: 3px solid #33ff33;
            padding: 0.6rem 1rem;
            margin: 0.3rem 0;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            color: #7fff7f;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
            z-index: 1;
        }
        .code-block::before {
            content: '⎔ ';
            color: #1a6b1a;
            opacity: 0.5;
        }

        /* ── separator ── */
        .sep {
            display: block;
            color: #1a3a1a;
            font-size: 0.7rem;
            letter-spacing: 2px;
            padding: 0.2rem 0;
            opacity: 0.4;
        }
        .sep::before {
            content: '─── ';
            color: #1a3a1a;
        }

        /* ── status / footer ── */
        .status {
            margin-top: 1.2rem;
            padding-top: 0.6rem;
            border-top: 1px solid #0d2a0d;
            font-size: 0.7rem;
            color: #1a5a1a;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
            position: relative;
            z-index: 1;
        }
        .status .tag {
            color: #2a7a2a;
        }
        .status .blink {
            animation: blink 1.2s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.15;
            }
        }

        /* ── scrollbar styling ── */
        .terminal::-webkit-scrollbar {
            width: 6px;
        }
        .terminal::-webkit-scrollbar-track {
            background: #050f05;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #1a4a1a;
            border-radius: 3px;
        }
        .terminal::-webkit-scrollbar-thumb:hover {
            background: #2a6a2a;
        }

        /* ── responsive ── */
        @media (max-width: 600px) {
            body {
                padding: 0.6rem 0.4rem;
            }
            .terminal {
                padding: 1rem 0.8rem;
                min-height: 96vh;
                border-radius: 6px;
            }
            #out {
                font-size: 0.8rem;
                line-height: 1.6;
            }
            .ln::before {
                content: '› ';
            }
            .code-block {
                font-size: 0.75rem;
                padding: 0.4rem 0.6rem;
            }
            .status {
                font-size: 0.6rem;
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 400px) {
            .terminal {
                padding: 0.6rem 0.4rem;
                border-radius: 4px;
            }
            #out {
                font-size: 0.7rem;
                line-height: 1.5;
            }
            .ln::before {
                content: '>';
            }
        }

        /* ── print() / show() special ── */
        .ln.print-line::before {
            content: '◈ ';
            color: #1a6b1a;
            opacity: 0.5;
        }

        /* ── nil / null special ── */
        .nil {
            color: #4a6a4a;
        }
        .bool-true {
            color: #66ff66;
        }
        .bool-false {
            color: #4a6a4a;
        }
        .number {
            color: #55dd55;
        }
        .string {
            color: #88ff88;
        }
        .array-bracket {
            color: #3a8a3a;
        }

        /* ── blink cursor at end ── */
        .cursor-line {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            margin-top: 0.2rem;
            opacity: 0.6;
            z-index: 1;
            position: relative;
        }
        .cursor-line::before {
            content: '❯ ';
            color: #1a6b1a;
            opacity: 0.4;
        }
        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1.1em;
            background: #33ff33;
            animation: cursor-blink 1s step-end infinite;
            border-radius: 1px;
        }
        @keyframes cursor-blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="terminal" role="main" aria-label="VCG Terminal">
        <div id="out"></div>
        <div class="cursor-line"><span class="cursor"></span></div>
        <div class="status">
            <span><span class="tag">⏣</span> VCG v3.0.0 · Syrian Private Programming</span>
            <span><span class="blink">⬤</span> running</span>
        </div>
    </div>

    <script>
        /* ── VCG Runtime ────────────────────────────────────────────── */

        var _OUT = document.getElementById('out');

        /* ----- helpers for styled output ----- */
        function _styleVal(v) {
            if (v === null || v === undefined) return '<span class="nil">nil</span>';
            if (v === true) return '<span class="bool-true">true</span>';
            if (v === false) return '<span class="bool-false">false</span>';
            if (typeof v === 'number') {
                if (Number.isInteger(v)) return '<span class="number">' + v + '</span>';
                return '<span class="number">' + v.toFixed(4).replace(/\.?0+$/, '') + '</span>';
            }
            if (typeof v === 'string') return '<span class="string">"' + v + '"</span>';
            if (Array.isArray(v)) {
                var items = v.map(function(x) { return _styleVal(x); }).join('<span class="array-bracket">, </span>');
                return '<span class="array-bracket">[</span> ' + items + ' <span class="array-bracket">]</span>';
            }
            if (typeof v === 'object') {
                try { return '<span class="string">' + JSON.stringify(v) + '</span>'; } catch (_) { return '[object]'; }
            }
            return String(v);
        }

        function _vcg_print(arr) {
            var parts = [];
            for (var i = 0; i < arr.length; i++) {
                var v = arr[i];
                if (v === null || v === undefined) { parts.push('<span class="nil">nil</span>'); } else if (typeof v ===
                    'string') { parts.push('<span class="string">"' + v + '"</span>'); } else if (typeof v === 'number') {
                    if (Number.isInteger(v)) parts.push('<span class="number">' + v + '</span>');
                    else parts.push('<span class="number">' + v.toFixed(4).replace(/\.?0+$/, '') + '</span>');
                } else if (v === true) { parts.push('<span class="bool-true">true</span>'); } else if (v === false) { parts
                        .push('<span class="bool-false">false</span>'); } else if (Array.isArray(v)) {
                    var items = v.map(function(x) { return _styleVal(x); }).join('<span class="array-bracket">, </span>');
                    parts.push('<span class="array-bracket">[</span> ' + items + ' <span class="array-bracket">]</span>');
                } else if (typeof v === 'object') {
                    try { parts.push(JSON.stringify(v)); } catch (_) { parts.push('[object]'); }
                } else { parts.push(String(v)); }
            }
            var el = document.createElement('span');
            el.className = 'ln print-line';
            el.innerHTML = parts.join(' ');
            _OUT.appendChild(el);
        }

        function _vcg_html(s) {
            var el = document.createElement('span');
            el.className = 'ln';
            el.innerHTML = String(s);
            _OUT.appendChild(el);
        }

        /* ----- truthy ----- */
        function _truthy(v) {
            return v !== null && v !== false && v !== 0 && v !== '' && v !== undefined;
        }

        /* ----- equality (deep-ish) ----- */
        function _vcg_eq(a, b) {
            if (a === b) return true;
            if (a === null && b === null) return true;
            if (typeof a !== 'object' && typeof b !== 'object') return a == b;
            if (Array.isArray(a) && Array.isArray(b)) {
                if (a.length !== b.length) return false;
                for (var i = 0; i < a.length; i++) { if (!_vcg_eq(a[i], b[i])) return false; }
                return true;
            }
            if (typeof a === 'object' && typeof b === 'object' && a !== null && b !== null) {
                var ka = Object.keys(a),
                    kb = Object.keys(b);
                if (ka.length !== kb.length) return false;
                for (var i = 0; i < ka.length; i++) {
                    if (!_vcg_eq(a[ka[i]], b[ka[i]])) return false;
                }
                return true;
            }
            return false;
        }

        /* ----- binary ops ----- */
        function _bin(op, a, b) {
            if (op === '+' && (typeof a === 'string' || typeof b === 'string')) return String(a) + String(b);
            if (op === '+' && Array.isArray(a) && Array.isArray(b)) return a.concat(b);
            if (op === '..') {
                var r = [],
                    f = Math.floor(a),
                    t = Math.floor(b),
                    s = f <= t ? 1 : -1;
                for (var i = f; s > 0 ? i <= t : i >= t; i += s) r.push(i);
                return r;
            }
            switch (op) {
                case '+':
                    return a + b;
                case '-':
                    return a - b;
                case '*':
                    return a * b;
                case '/':
                    if (b === 0) throw new Error('Division by zero');
                    return a / b;
                case '%':
                    if (b === 0) throw new Error('Modulo by zero');
                    return a % b;
                case '**':
                    return Math.pow(a, b);
                case '==':
                    return _vcg_eq(a, b);
                case '!=':
                    return !_vcg_eq(a, b);
                case '<':
                    return a < b;
                case '>':
                    return a > b;
                case '<=':
                    return a <= b;
                case '>=':
                    return a >= b;
                case 'and':
                    return _truthy(a) && _truthy(b);
                case 'or':
                    return _truthy(a) || _truthy(b);
                case '|':
                    return (a | 0) | (b | 0);
                case '&':
                    return (a | 0) & (b | 0);
                case '<<':
                    return (a | 0) << (b | 0);
                case '>>':
                    return (a | 0) >> (b | 0);
            }
            return null;
        }

        /* ----- scope ----- */
        function _scope(p) { return Object.create(p || null); }

        function _def(e, k, v) { Object.defineProperty(e, k, { value: v, writable: true, configurable: true,
                enumerable: true }); return v; }

        function _set(e, k, v) {
            var c = e;
            while (c) { if (Object.prototype.hasOwnProperty.call(c, k)) { c[k] = v; return v; } c = Object.getPrototypeOf(c); }
            e[k] = v;
            return v;
        }

        function _v(k, e) {
            var c = e;
            while (c) { if (k in c) return c[k]; c = Object.getPrototypeOf(c); }
            throw new Error('Undefined: ' + k);
        }

        /* ----- index / field ----- */
        function _idx(o, i) {
            if (o === null) return null;
            if (Array.isArray(o)) { var j = i < 0 ? o.length + i : i; return (j >= 0 && j < o.length) ? o[j] : null; }
            if (typeof o === 'string') { var j = i < 0 ? o.length + i : i; return (j >= 0 && j < o.length) ? o[j] : null; }
            if (typeof o === 'object') return (o[i] !== undefined) ? o[i] : null;
            return null;
        }

        function _setidx(o, i, v) {
            if (Array.isArray(o)) { if (i < 0) i = o.length + i;
                o[i] = v; } else if (typeof o === 'object') o[i] = v;
        }

        function _field(o, k) { return (o && typeof o === 'object' && k in o) ? o[k] : null; }

        function _setfield(o, k, v) { if (o && typeof o === 'object') o[k] = v; }

        /* ----- typeof / sizeof ----- */

            if (v === null) return 'nil';
            if (v === true || v === false) return 'bool';

            if (typeof v === 'object') return 'struct';
            return typeof v;
        }

        function _sizeof(v) {
            if (Array.isArray(v)) return v.length;
            if (typeof v === 'string') return v.length;

            return 1;
        }

        /* ----- call / method ----- */
        function _call(f, args, e) {
            if (typeof f === 'function') return f.apply(null, args);
            throw new Error('Not callable');
        }

        function _method(obj, name, args, e) {
            if (Array.isArray(obj)) {
                if (name === 'push') { obj.push.apply(obj, args); return obj.length; }
                if (name === 'pop') return obj.pop();
                if (name === 'len' || name === 'length') return obj.length;
                if (name === 'join') return obj.join(args[0] !== undefined ? args[0] : ',');
                if (name === 'contains') return obj.indexOf(args[0]) >= 0;
                if (name === 'reverse') { obj.reverse(); return obj; }
                if (name === 'slice') return obj.slice(args[0] || 0, args[1]);
                if (name === 'sort') { obj.sort(function(a, b) { return a - b; }); return obj; }
            }
            if (typeof obj === 'string') {
                if (name === 'len' || name === 'length') return obj.length;
                if (name === 'upper') return obj.toUpperCase();
                if (name === 'lower') return obj.toLowerCase();
                if (name === 'trim') return obj.trim();
                if (name === 'split') return obj.split(args[0] !== undefined ? args[0] : ' ');
                if (name === 'contains') return obj.includes(String(args[0]));
                if (name === 'startswith') return obj.startsWith(String(args[0]));
                if (name === 'endswith') return obj.endsWith(String(args[0]));
                if (name === 'replace') return obj.replaceAll(String(args[0]), String(args[1]));
                if (name === 'tonum') return parseFloat(obj);
                if (name === 'indexof') return obj.indexOf(String(args[0]));
            }
            if (obj && typeof obj === 'object' && typeof obj[name] === 'function') return obj[name].apply(obj, args);
            throw new Error('No method: ' + name);
        }

        /* ── Stdlib ─────────────────────────────────────────────────── */

        var _e = _scope(null);

        _def(_e, 'floor', function(x) { return Math.floor(x); });

        function _vcg_channel(name, init) {
            var ch = { _name: name, _buf: [] };

        _def(_e, 'store', function() { return _vcg_store; });
        _def(_e, 'exports', function() { return _vcg_exports; });
        _def(_e, 'send', _vcg_send);
        _def(_e, 'recv', _vcg_recv);
        _def(_e, 'pipe', _vcg_pipe);

        _def(_e, 'VCG_VERSION', '3.0.0');
        _def(_e, 'VCG_DATE', '2026-06-06');

        /* ── User Program ──────────────────────────────────────────── */

        try {
            _def(_e, 'i', 42);
            _def(_e, 'f', 3.14);
            _def(_e, 's', "مرحبا");
            _def(_e, 'b', true);
            _def(_e, 'n', null);
            _def(_e, 'arr', [1, 2, 3, 4, 5]);
            _def(_e, 'obj', { "name": "VCG", "version": 2, "active": true });

            _vcg_print(["=== الأنواع الأساسية ==="]);
            _vcg_print(["int   :", _v('i', _e), "→", _typeof(_v('i', _e))]);
            _vcg_print(["float :", _v('f', _e), "→", _typeof(_v('f', _e))]);
            _vcg_print(["string:", _v('s', _e), "→", _typeof(_v('s', _e))]);
