<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#00ff41;
  font-family:'Courier New',monospace;
  overflow:hidden;
}
#terminal{
  width:100vw;
  height:100vh;
  background:#000;
  padding:2rem 3rem;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  overflow:hidden;
}
#out{
  width:100%;
  flex:1;
  font-size:1.1rem;
  line-height:2;
  overflow:hidden;
  position:relative;
}
.ln{
  display:block;
  padding:0.1rem 0.3rem;
  white-space:pre-wrap;
  word-break:break-all;
  opacity:0;
  animation:typing 0.05s ease forwards;
  font-family:'Courier New',monospace;
}
@keyframes typing{
  0%{opacity:0;transform:translateX(-5px);}
  100%{opacity:1;transform:translateX(0);}
}
.output-line{
  color:#00ff41;
}
.output-line:before{
  content:"→ ";
  color:#00ff41;
  opacity:0.3;
}
.divider{
  color:#004d1a;
  letter-spacing:2px;
  opacity:0.5;
}
.divider:before{
  content:"";
}
.header-line{
  color:#00ff41;
  font-weight:bold;
  text-shadow:0 0 30px rgba(0,255,65,0.15);
}
.header-line:before{
  content:"";
}
.error{
  color:#ff3333;
}
.error:before{
  content:"✗ ";
  color:#ff3333;
}
.cursor{
  display:inline-block;
  width:12px;
  height:24px;
  background:#00ff41;
  animation:blink 0.8s step-end infinite;
  vertical-align:middle;
  margin-left:4px;
  position:relative;
  top:2px;
}
@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0}
}
footer{
  color:#004d1a;
  font-size:0.8rem;
  letter-spacing:2px;
  padding:0.5rem 0;
  border-top:1px solid #004d1a;
  margin-top:0.5rem;
  opacity:0.5;
  text-align:center;
}
footer b{
  color:#00ff41;
}
</style>
</head>
<body>
<div id="terminal">
  <div id="out"></div>
  <footer>═ VCG Terminal v3.0 — Syrian Private Programming ═</footer>
</div>
<script>
var _OUT=document.getElementById('out');
var lineCounter=0;

function _vcg_print(arr){
  var s=arr.map(function(v){
    return v===null?'nil':v===true?'true':v===false?'false':
    Array.isArray(v)?'['+v.map(String).join(', ')+']':
    typeof v==='object'&&v?JSON.stringify(v):String(v);
  }).join(' ');
  var el=document.createElement('span');
  el.className='ln output-line';
  el.style.animationDelay=(lineCounter*0.06)+'s';
  el.textContent=s;
  _OUT.appendChild(el);
  lineCounter++;
  _OUT.scrollTop=_OUT.scrollHeight;
}

function _vcg_print_raw(s,cls){
  var el=document.createElement('span');
  el.className='ln '+(cls||'');
  el.style.animationDelay=(lineCounter*0.06)+'s';
  el.textContent=s;
  _OUT.appendChild(el);
  lineCounter++;
  _OUT.scrollTop=_OUT.scrollHeight;
}

function _truthy(v){return v!==null&&v!==false&&v!==0&&v!==''&&v!==undefined;}

function _bin(op,a,b){
  if(op==='+'&&(typeof a==='string'||typeof b==='string'))return String(a)+String(b);
  if(op==='+'&&Array.isArray(a)&&Array.isArray(b))return a.concat(b);
  if(op==='..'){
    var r=[],f=Math.floor(a),t=Math.floor(b),s=f<=t?1:-1;
    for(var i=f;s>0?i<=t:i>=t;i+=s)r.push(i);return r;
  }
  switch(op){
    case '+':return a+b;case '-':return a-b;case '*':return a*b;
    case '/':if(b===0)throw new Error('Division by zero');return a/b;
    case '%':if(b===0)throw new Error('Modulo by zero');return a%b;
    case '**':return Math.pow(a,b);
    case '==':return a==b;case '!=':return a!=b;
    case '<':return a<b;case '>':return a>b;case '<=':return a<=b;case '>=':return a>=b;
    case 'and':return _truthy(a)&&_truthy(b);
    case 'or':return _truthy(a)||_truthy(b);
  }return null;
}

function _scope(p){return Object.create(p||null);}
function _def(e,k,v){Object.defineProperty(e,k,{value:v,writable:true,configurable:true,enumerable:true});return v;}
function _v(k,e){var c=e;while(c){if(k in c)return c[k];c=Object.getPrototypeOf(c);}throw new Error('Undefined: '+k);}

var _e=_scope(null);
_def(_e,'abs',Math.abs);_def(_e,'floor',Math.floor);_def(_e,'ceil',Math.ceil);
_def(_e,'round',Math.round);_def(_e,'sqrt',Math.sqrt);_def(_e,'pow',Math.pow);
_def(_e,'sin',Math.sin);_def(_e,'cos',Math.cos);_def(_e,'tan',Math.tan);
_def(_e,'min',function(){return Math.min.apply(null,arguments);});
_def(_e,'max',function(){return Math.max.apply(null,arguments);});
_def(_e,'rand',function(a,b){if(a===undefined)return Math.random();if(b===undefined)return Math.floor(Math.random()*a);return Math.floor(Math.random()*(b-a))+a;});
_def(_e,'range',function(a,b,s){var r=[],f=b===undefined?0:a,t=b===undefined?a:b,st=s||1;for(var i=f;i<t;i+=st)r.push(i);return r;});
_def(_e,'len',function(x){if(Array.isArray(x))return x.length;if(typeof x==='string')return x.length;if(x&&typeof x==='object')return Object.keys(x).length;return 0;});
_def(_e,'str',function(x){return String(x);});
_def(_e,'int',function(x){return parseInt(x)||0;});
_def(_e,'float',function(x){return parseFloat(x)||0;});
_def(_e,'bool',function(x){return _truthy(x);});
_def(_e,'typeof',function(v){if(v===null)return 'nil';if(Array.isArray(v))return 'array';return typeof v;});
_def(_e,'PI',Math.PI);_def(_e,'E',Math.E);
_def(_e,'true',true);_def(_e,'false',false);_def(_e,'nil',null);
_def(_e,'show',function(){_vcg_print(Array.from(arguments));return null;});
_def(_e,'print',function(){_vcg_print(Array.from(arguments));return null;});

try{
  // ============================================
  // Syrian VCG — Hello World (بدون عرض الأوامر)
  // ============================================
  
  _vcg_print_raw("╔════════════════════════════════════════════════════╗", 'header-line');
  _vcg_print_raw("║        SYRIAN VCG — HELLO WORLD v3.0            ║", 'header-line');
  _vcg_print_raw("╚════════════════════════════════════════════════════╝", 'header-line');
  _vcg_print_raw("", 'divider');
  
  // التنفيذ المباشر للأوامر دون عرضها
  _vcg_print(["مرحباً بكم في لغة VCG السورية!"]);
  _vcg_print(["Syrian Private Programming Language v2.0"]);
  _vcg_print(["---"]);
  
  let name = "سوريا الحبيبة";
  let year = 2025;
  
  _vcg_print(["الوطن:", name]);
  _vcg_print(["السنة:", year]);
  _vcg_print(["---"]);
  
  _vcg_print(["2 + 3   =", 2 + 3]);
  _vcg_print(["10 * 5  =", 10 * 5]);
  _vcg_print(["100 / 4 =", 100 / 4]);
  _vcg_print(["2 ** 8  =", 2 ** 8]);
  _vcg_print(["17 % 5  =", 17 % 5]);
  
  _vcg_print_raw("", 'divider');
  _vcg_print_raw("✓ تم التنفيذ بنجاح", 'header-line');
  
  // إضافة المؤشر الوامض
  setTimeout(function(){
    var cursorSpan=document.createElement('span');
    cursorSpan.className='cursor';
    _OUT.appendChild(cursorSpan);
  }, 500);
  
}catch(e){
  var el=document.createElement('span');
  el.className='ln error';
  el.textContent='ERROR: '+e.message;
  _OUT.appendChild(el);
  console.error(e);
}
</script>
</body>
</html>
