<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VCG Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:#00ff41;font-family:'Courier New',monospace;overflow:hidden}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;padding:0.8rem;background:#000}
#display{
  flex:1;
  background:#0a0a0a;
  border:1px solid #004d1a;
  border-radius:8px;
  padding:0.8rem 1.2rem;
  margin-bottom:0.8rem;
  overflow-y:auto;
  font-size:1.4rem;
  line-height:2;
  min-height:120px;
  box-shadow:inset 0 0 30px rgba(0,255,65,0.03);
}
#display .ln{
  display:block;
  opacity:0;
  animation:typing 0.05s ease forwards;
  padding:0.05rem 0;
}
@keyframes typing{0%{opacity:0;transform:translateX(-4px)}100%{opacity:1;transform:translateX(0)}}
#display .result{color:#00ff41;font-weight:bold;text-shadow:0 0 20px rgba(0,255,65,0.15)}
#display .expr{color:#00aa55;opacity:0.7}
#display .error{color:#ff3333}
#display .error:before{content:"✗ "}
#grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:0.4rem;
  background:#000;
  padding:0.2rem;
}
.btn{
  background:#0a0a0a;
  border:1px solid #004d1a;
  border-radius:6px;
  color:#00ff41;
  font-size:1.3rem;
  font-family:'Courier New',monospace;
  padding:0.8rem 0.2rem;
  cursor:pointer;
  transition:all 0.15s;
  text-align:center;
  user-select:none;
}
.btn:hover{background:#00ff41;color:#000;border-color:#00ff41;box-shadow:0 0 20px rgba(0,255,65,0.2)}
.btn:active{transform:scale(0.94)}
.btn.op{color:#00dd77;border-color:#006633}
.btn.op:hover{background:#00dd77;color:#000}
.btn.fn{color:#66ffaa;border-color:#006644}
.btn.fn:hover{background:#66ffaa;color:#000}
.btn.eq{background:#004d1a;color:#00ff41;border-color:#00ff41;font-weight:bold}
.btn.eq:hover{background:#00ff41;color:#000}
.btn.span2{grid-column:span 2}
.btn.clear{color:#ff6666;border-color:#661111}
.btn.clear:hover{background:#ff6666;color:#000}
.btn.ce{color:#ffaa44;border-color:#664411}
.btn.ce:hover{background:#ffaa44;color:#000}
#status{
  color:#004d1a;
  font-size:0.7rem;
  text-align:center;
  padding-top:0.3rem;
  border-top:1px solid #004d1a;
  margin-top:0.3rem;
  opacity:0.5;
  letter-spacing:1px;
}
#status b{color:#00ff41}
</style>
</head>
<body>
<div id="app">
  <div id="display"></div>
  <div id="grid">
    <div class="btn ce" data-action="clear">CE</div>
    <div class="btn clear" data-action="clearall">C</div>
    <div class="btn fn" data-action="backspace">⌫</div>
    <div class="btn fn" data-action="sqrt">√</div>
    <div class="btn op" data-action="^">^</div>

    <div class="btn" data-action="7">7</div>
    <div class="btn" data-action="8">8</div>
    <div class="btn" data-action="9">9</div>
    <div class="btn op" data-action="/">÷</div>
    <div class="btn op" data-action="%">%</div>

    <div class="btn" data-action="4">4</div>
    <div class="btn" data-action="5">5</div>
    <div class="btn" data-action="6">6</div>
    <div class="btn op" data-action="*">×</div>
    <div class="btn op" data-action="-">−</div>

    <div class="btn" data-action="1">1</div>
    <div class="btn" data-action="2">2</div>
    <div class="btn" data-action="3">3</div>
    <div class="btn op" data-action="+">+</div>
    <div class="btn eq" data-action="=">=</div>

    <div class="btn span2" data-action="0">0</div>
    <div class="btn" data-action=".">.</div>
    <div class="btn fn" data-action="(">(</div>
    <div class="btn fn" data-action=")">)</div>
  </div>
  <div id="status">═ VCG Calculator v3.0 — <b>Syrian Private Programming</b> ═</div>
</div>
<script>
// ====== عناصر DOM ======
const display = document.getElementById('display');
const grid = document.getElementById('grid');
let currentExpr = '';
let lastResult = null;
let lineCounter = 0;

// ====== دوال مساعدة ======
function printLine(text, cls = '') {
  const span = document.createElement('span');
  span.className = 'ln' + (cls ? ' ' + cls : '');
  span.style.animationDelay = (lineCounter * 0.04) + 's';
  span.textContent = text;
  display.appendChild(span);
  lineCounter++;
  display.scrollTop = display.scrollHeight;
}

function clearDisplay() {
  display.innerHTML = '';
  lineCounter = 0;
}

function showError(msg) {
  printLine('خطأ: ' + msg, 'error');
}

// ====== تقييم التعبير ======
function evaluate(expr) {
  try {
    // استبدال الرموز
    let sanitized = expr
      .replace(/×/g, '*')
      .replace(/÷/g, '/')
      .replace(/−/g, '-')
      .replace(/√/g, 'Math.sqrt')
      .replace(/\^/g, '**');

    // التحقق من وجود دوال غير مسموحة (لأمان)
    if (/[a-zA-Z]/.test(sanitized.replace(/Math\.sqrt/g, ''))) {
      throw new Error('يُسمح فقط بالأرقام والعمليات');
    }

    const result = Function('"use strict"; return (' + sanitized + ')')();
    if (typeof result !== 'number' || !isFinite(result)) {
      throw new Error('نتيجة غير صالحة');
    }
    return result;
  } catch (e) {
    throw new Error(e.message || 'تعبير غير صحيح');
  }
}

// ====== معالجة الأزرار ======
grid.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'clear') {
    // CE: مسح آخر رقم أو عملية
    currentExpr = currentExpr.replace(/[\d.]+$/, '');
    if (currentExpr.endsWith(' ')) currentExpr = currentExpr.slice(0, -1);
    printLine('CE', 'expr');
    return;
  }

  if (action === 'clearall') {
    currentExpr = '';
    clearDisplay();
    printLine('─ تم المسح ─', 'expr');
    return;
  }

  if (action === 'backspace') {
    currentExpr = currentExpr.slice(0, -1);
    printLine('⌫', 'expr');
    return;
  }

  if (action === '=') {
    if (!currentExpr.trim()) return;
    printLine('= ' + currentExpr, 'expr');
    try {
      const result = evaluate(currentExpr);
      const rounded = Number.isInteger(result) ? result : parseFloat(result.toFixed(10));
      printLine('→ ' + String(rounded), 'result');
      lastResult = rounded;
      currentExpr = String(rounded);
    } catch (err) {
      showError(err.message);
      currentExpr = '';
    }
    return;
  }

  // الأرقام والعمليات
  let val = btn.textContent;
  // إذا كان هناك نتيجة سابقة وبدأنا برقم، نبدأ تعبيراً جديداً
  if (lastResult !== null && /^[\d.]$/.test(val)) {
    currentExpr = '';
    lastResult = null;
  }
  currentExpr += val;
  printLine(val, 'expr');
});

// ====== دعم لوحة المفاتيح ======
document.addEventListener('keydown', (e) => {
  const key = e.key;
  const validKeys = /^[\d.]$|[\+\-\*\/\(\)]|Enter|Backspace|Escape|\^/;
  if (!validKeys.test(key)) return;

  e.preventDefault();
  const btnMap = {
    'Enter': '=',
    'Backspace': 'backspace',
    'Escape': 'clearall',
    '^': '^',
    '*': '*',
    '/': '/',
    '+': '+',
    '-': '-',
    '(': '(',
    ')': ')',
  };
  let action = key;
  if (btnMap[key]) action = btnMap[key];

  // محاكاة النقر على الزر المناسب
  const targetBtn = Array.from(grid.querySelectorAll('.btn')).find(b => b.dataset.action === action);
  if (targetBtn) {
    targetBtn.click();
  } else if (/^[\d.]$/.test(key)) {
    // البحث عن زر يحمل نفس الرقم
    const numBtn = Array.from(grid.querySelectorAll('.btn')).find(b => b.textContent === key);
    if (numBtn) numBtn.click();
  }
});

// ====== الترحيب ======
printLine('╔══════════════════════════════════════╗', 'expr');
printLine('║     VCG CALCULATOR — SYRIAN v3.0   ║', 'expr');
printLine('╚══════════════════════════════════════╝', 'expr');
printLine('', '');
printLine('استخدم الأزرار أو لوحة المفاتيح', 'expr');
printLine('مثال: 2+3*4  أو  (2+3)*4  أو  √(16)', 'expr');
printLine('─'.repeat(38), 'expr');
</script>
</body>
</html>
