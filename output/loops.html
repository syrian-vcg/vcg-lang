<style>

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#00ff41;
  font-family:'Courier New',monospace;
  overflow:hidden;
}
#terminal{
  width:100vw;
  height:100vh;
  background:#000;
  padding:2rem 3rem;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  overflow:hidden;
}

  width:100%;
  flex:1;
  font-size:1.1rem;
  line-height:2;
  overflow:hidden;
  position:relative;
}
.ln{

  opacity:0;

  font-family:'Courier New',monospace;

  0%{opacity:0;transform:translateX(-5px);}
  100%{opacity:1;transform:translateX(0);}
}
.output-line{
  color:#00ff41;
}
.output-line:before{
  content:"→ ";
  color:#00ff41;
  opacity:0.3;
}
.header-line{
  color:#00ff41;
  font-weight:bold;
  text-shadow:0 0 30px rgba(0,255,65,0.15);
}
.header-line:before{
  content:"";
}
.divider{
  color:#004d1a;
  letter-spacing:2px;
  opacity:0.5;
}
.divider:before{
  content:"";
}
.error{
  color:#ff3333;
}
.error:before{
  content:"✗ ";
  color:#ff3333;
}
.cursor{

  width:12px;
  height:24px;
  background:#00ff41;

  vertical-align:middle;
  margin-left:4px;
  position:relative;
  top:2px;
}
@keyframes blink{

  50%{opacity:0}
}
footer{
  color:#004d1a;
  font-size:0.8rem;
  letter-spacing:2px;
  padding:0.5rem 0;
  border-top:1px solid #004d1a;
  margin-top:0.5rem;
  opacity:0.5;
  text-align:center;
}
footer b{
  color:#00ff41;

<body>
<div id="terminal">
  <div id="out"></div>

<script>
var _OUT=document.getElementById('out');

function _vcg_print(arr){

    return v===null?'nil':v===true?'true':v===false?'false':

function _truthy(v){return v!==null&&v!==false&&v!==0&&v!==''&&v!==undefined;}

function _scope(p){return Object.create(p||null);}

function _method(obj,name,args,e){
  if(Array.isArray(obj)){
    if(name==='push'){obj.push.apply(obj,args);return obj.length;}
    if(name==='pop')return obj.pop();
    if(name==='len'||name==='length')return obj.length;
    if(name==='join')return obj.join(args[0]!==undefined?args[0]:',');

    if(name==='reverse'){obj.reverse();return obj;}

    if(name==='sort'){obj.sort(function(a,b){return a-b;});return obj;}

    if(name==='len'||name==='length')return obj.length;
    if(name==='upper')return obj.toUpperCase();
    if(name==='lower')return obj.toLowerCase();
    if(name==='trim')return obj.trim();
    if(name==='split')return obj.split(args[0]!==undefined?args[0]:' ');
    if(name==='contains')return obj.includes(String(args[0]));
    if(name==='startswith')return obj.startsWith(String(args[0]));
    if(name==='endswith')return obj.endsWith(String(args[0]));
    if(name==='replace')return obj.replaceAll(String(args[0]),String(args[1]));

    if(name==='indexof')return obj.indexOf(String(args[0]));
  }
  if(obj&&typeof obj==='object'&&typeof obj[name]==='function')return obj[name].apply(obj,args);

/* ── Stdlib ─────────────────────── */

_def(_e,'len',function(x){if(Array.isArray(x))return x.length;if(typeof x==='string')return x.length;if(x&&typeof x==='object')return Object.keys(x).length;return 0;});

_def(_e,'typeof',_typeof);

_def(_e,'isnum',function(x){return typeof x==='number';});

/* ── v3.0 Reactive Runtime ───────── */

_def(_e,'watch',function(k,fn){ _vcg_watchers[k]=fn; });_def(_e,'store',function(){ return _vcg_store; });_def(_e,'exports',function(){ return _vcg_exports; });_def(_e,'send',_vcg_send);_def(_e,'recv',_vcg_recv);_def(_e,'pipe',_vcg_pipe);_def(_e,'freeze',function(v){return Object.freeze(v)||v;});_def(_e,'VCG_VERSION','3.0.0');_def(_e,'VCG_DATE','2026-06-06');

  // while

  var _it2=_v('fruits',_e);
