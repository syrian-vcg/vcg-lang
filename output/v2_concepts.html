<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCG — v2 Concepts Demo</title>
    <style>
        /* ===== White Background, Clean UI ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #terminal {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            padding: 1.8rem 2.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #out {
            flex: 1;
            font-size: 1rem;
            line-height: 1.8;
            overflow-y: auto;
            padding-bottom: 0.5rem;
        }

        /* ===== Fade-in Animation ===== */
        .ln {
            display: block;
            padding: 0.05rem 0.1rem;
            opacity: 0;
            animation: fadeIn 0.2s ease forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== Output Styling ===== */
        .output-line {
            color: #222;
            font-family: 'Segoe UI', sans-serif;
        }
        .output-line:before {
            content: "▪ ";
            color: #888;
            opacity: 0.4;
        }
        .header-line {
            color: #1a1a1a;
            font-weight: 600;
            font-size: 1.2rem;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 0.2rem;
            margin-top: 0.8rem;
        }
        .header-line:before {
            content: "";
        }
        .section-title {
            color: #0055aa;
            font-weight: 600;
            font-size: 1.05rem;
            margin-top: 0.5rem;
            padding: 0.1rem 0;
        }
        .section-title:before {
            content: "▸ ";
            color: #0055aa;
        }
        .divider {
            color: #cccccc;
            letter-spacing: 2px;
            text-align: center;
            font-size: 0.85rem;
        }
        .divider:before {
            content: "— ";
        }
        .divider:after {
            content: " —";
        }
        .error {
            color: #cc0000;
            background: #ffeeee;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            border-right: 3px solid #cc0000;
        }
        .error:before {
            content: "⚠️ ";
        }

        /* ===== Natural Buttons (if any) ===== */
        .ui-btn {
            display: inline-block;
            background: #f5f5f5;
            border: 1px solid #cccccc;
            color: #333;
            padding: 0.3rem 1.2rem;
            margin: 0.15rem 0.3rem 0.15rem 0;
            border-radius: 4px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.1s;
            text-decoration: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .ui-btn:hover {
            background: #e8e8e8;
            border-color: #aaa;
        }
        .ui-btn:active {
            transform: scale(0.97);
            background: #ddd;
        }

        .ui-key {
            display: inline-block;
            background: #f0f0f0;
            border: 1px solid #ccc;
            color: #222;
            padding: 0.05rem 0.7rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            margin: 0.1rem 0.2rem;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        /* ===== Footer ===== */
        footer {
            color: #aaaaaa;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-align: center;
            padding-top: 0.5rem;
            border-top: 1px solid #e0e0e0;
            margin-top: 0.5rem;
        }
        footer b { color: #333; }

        /* ===== Scrollbar ===== */
        #out::-webkit-scrollbar { width: 6px; }
        #out::-webkit-scrollbar-track { background: #f5f5f5; }
        #out::-webkit-scrollbar-thumb { background: #cccccc; border-radius: 3px; }
        #out::-webkit-scrollbar-thumb:hover { background: #aaaaaa; }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="out"></div>
        <footer>═ VCG v2.0 — Syrian Private Programming ═</footer>
    </div>
    <script>
        // ============================================================
        //  VCG Runtime — v2 Concepts (White UI, Output Only)
        // ============================================================

        var _OUT = document.getElementById('out');
        var lineCounter = 0;

        // ── Core printing ──────────────────────────────────────────
        function _vcg_print(arr, cls) {
            var s = arr.map(function(v) {
                if (v === null) return 'nil';
                if (v === true) return 'true';
                if (v === false) return 'false';
                if (Array.isArray(v)) return '[' + v.map(String).join(', ') + ']';
                if (typeof v === 'object' && v) return JSON.stringify(v);
                return String(v);
            }).join(' ');
            var el = document.createElement('span');
            el.className = 'ln ' + (cls || 'output-line');
            el.style.animationDelay = (lineCounter * 0.025) + 's';
            el.textContent = s;
            _OUT.appendChild(el);
            lineCounter++;
            _OUT.scrollTop = _OUT.scrollHeight;
        }

        function _vcg_print_raw(s, cls) {
            var el = document.createElement('span');
            el.className = 'ln ' + (cls || '');
            el.style.animationDelay = (lineCounter * 0.025) + 's';
            el.textContent = s;
            _OUT.appendChild(el);
            lineCounter++;
            _OUT.scrollTop = _OUT.scrollHeight;
        }

        // ── VCG base runtime helpers ──────────────────────────────
        function _truthy(v) { return v !== null && v !== false && v !== 0 && v !== '' && v !== undefined; }
        function _vcg_eq(a, b) { if (a === b) return true; if (a === null && b === null) return true; if (typeof a !== 'object' && typeof b !== 'object') return a == b; return false; }
        function _bin(op, a, b) {
            if (op === '+' && (typeof a === 'string' || typeof b === 'string')) return String(a) + String(b);
            if (op === '+' && Array.isArray(a) && Array.isArray(b)) return a.concat(b);
            if (op === '..') { var r = [], f = Math.floor(a), t = Math.floor(b), s = f <= t ? 1 : -1; for (var i = f; s > 0 ? i <= t : i >= t; i += s) r.push(i); return r; }
            switch (op) {
                case '+': return a + b;
                case '-': return a - b;
                case '*': return a * b;
                case '/': if (b === 0) throw new Error('Division by zero'); return a / b;
                case '%': if (b === 0) throw new Error('Modulo by zero'); return a % b;
                case '**': return Math.pow(a, b);
                case '==': return _vcg_eq(a, b);
                case '!=': return !_vcg_eq(a, b);
                case '<': return a < b;
                case '>': return a > b;
                case '<=': return a <= b;
                case '>=': return a >= b;
                case 'and': return _truthy(a) && _truthy(b);
                case 'or': return _truthy(a) || _truthy(b);
                case '|': return (a | 0) | (b | 0);
                case '&': return (a | 0) & (b | 0);
                case '<<': return (a | 0) << (b | 0);
                case '>>': return (a | 0) >> (b | 0);
            }
            return null;
        }
        function _scope(p) { return Object.create(p || null); }
        function _def(e, k, v) { Object.defineProperty(e, k, { value: v, writable: true, configurable: true, enumerable: true }); return v; }
        function _set(e, k, v) { var c = e; while (c) { if (Object.prototype.hasOwnProperty.call(c, k)) { c[k] = v; return v; } c = Object.getPrototypeOf(c); } e[k] = v; return v; }
        function _v(k, e) { var c = e; while (c) { if (k in c) return c[k]; c = Object.getPrototypeOf(c); } throw new Error('Undefined: ' + k); }
        function _idx(o, i) { if (o === null) return null; if (Array.isArray(o)) { var j = i < 0 ? o.length + i : i; return j >= 0 && j < o.length ? o[j] : null; } if (typeof o === 'string') { var j = i < 0 ? o.length + i : i; return j >= 0 && j < o.length ? o[j] : null; } if (typeof o === 'object') return o[i] !== undefined ? o[i] : null; return null; }
        function _setidx(o, i, v) { if (Array.isArray(o)) { if (i < 0) i = o.length + i; o[i] = v; } else if (typeof o === 'object') o[i] = v; }
        function _field(o, k) { return o && typeof o === 'object' && k in o ? o[k] : null; }
        function _setfield(o, k, v) { if (o && typeof o === 'object') o[k] = v; }
        function _typeof(v) { if (v === null) return 'nil'; if (v === true || v === false) return 'bool'; if (Array.isArray(v)) return 'array'; if (typeof v === 'object') return 'struct'; return typeof v; }
        function _sizeof(v) { if (Array.isArray(v)) return v.length; if (typeof v === 'string') return v.length; if (v && typeof v === 'object') return Object.keys(v).length; return 1; }
        function _call(f, args, e) { if (typeof f === 'function') return f.apply(null, args); throw new Error('Not callable'); }
        function _method(obj, name, args, e) {
            if (Array.isArray(obj)) {
                if (name === 'push') { obj.push.apply(obj, args); return obj.length; }
                if (name === 'pop') return obj.pop();
                if (name === 'len' || name === 'length') return obj.length;
                if (name === 'join') return obj.join(args[0] !== undefined ? args[0] : ',');
                if (name === 'contains') return obj.indexOf(args[0]) >= 0;
                if (name === 'reverse') { obj.reverse(); return obj; }
                if (name === 'slice') return obj.slice(args[0] || 0, args[1]);
                if (name === 'sort') { obj.sort(function(a, b) { return a - b; }); return obj; }
            }
            if (typeof obj === 'string') {
                if (name === 'len' || name === 'length') return obj.length;
                if (name === 'upper') return obj.toUpperCase();
                if (name === 'lower') return obj.toLowerCase();
                if (name === 'trim') return obj.trim();
                if (name === 'split') return obj.split(args[0] !== undefined ? args[0] : ' ');
                if (name === 'contains') return obj.includes(String(args[0]));
                if (name === 'startswith') return obj.startsWith(String(args[0]));
                if (name === 'endswith') return obj.endsWith(String(args[0]));
                if (name === 'replace') return obj.replaceAll(String(args[0]), String(args[1]));
                if (name === 'tonum') return parseFloat(obj);
                if (name === 'indexof') return obj.indexOf(String(args[0]));
            }
            if (obj && typeof obj === 'object' && typeof obj[name] === 'function') return obj[name].apply(obj, args);
            throw new Error('No method: ' + name);
        }

        // ── VCG Standard Library ──────────────────────────────────
        var _e = _scope(null);
        // Built-in functions
        _def(_e, 'abs', function(x) { return Math.abs(x); });
        _def(_e, 'floor', function(x) { return Math.floor(x); });
        _def(_e, 'ceil', function(x) { return Math.ceil(x); });
        _def(_e, 'round', function(x) { return Math.round(x); });
        _def(_e, 'sqrt', function(x) { return Math.sqrt(x); });
        _def(_e, 'pow', function(b, e2) { return Math.pow(b, e2); });
        _def(_e, 'log', function(x) { return Math.log(x); });
        _def(_e, 'log2', function(x) { return Math.log2(x); });
        _def(_e, 'log10', function(x) { return Math.log10(x); });
        _def(_e, 'sin', function(x) { return Math.sin(x); });
        _def(_e, 'cos', function(x) { return Math.cos(x); });
        _def(_e, 'tan', function(x) { return Math.tan(x); });
        _def(_e, 'min', function() { return Math.min.apply(null, arguments); });
        _def(_e, 'max', function() { return Math.max.apply(null, arguments); });
        _def(_e, 'rand', function(a, b) { if (a === undefined) return Math.random(); if (b === undefined) return Math.floor(Math.random() * a); return Math.floor(Math.random() * (b - a)) + a; });
        _def(_e, 'range', function(a, b, s) { var r = [], f = b === undefined ? 0 : a, t = b === undefined ? a : b, st = s || 1; for (var i = f; i < t; i += st) r.push(i); return r; });
        _def(_e, 'len', function(x) { if (Array.isArray(x)) return x.length; if (typeof x === 'string') return x.length; if (x && typeof x === 'object') return Object.keys(x).length; return 0; });
        _def(_e, 'str', function(x) { return x === null ? 'nil' : x === true ? 'true' : x === false ? 'false' : Array.isArray(x) ? '[' + x.map(String).join(', ') + ']' : String(x); });
        _def(_e, 'int', function(x) { return parseInt(x) || 0; });
        _def(_e, 'float', function(x) { return parseFloat(x) || 0; });
        _def(_e, 'bool', function(x) { return _truthy(x); });
        _def(_e, 'char', function(n) { return String.fromCharCode(n); });
        _def(_e, 'ord', function(s) { return s ? s.charCodeAt(0) : 0; });
        _def(_e, 'keys', function(o) { return o && typeof o === 'object' ? Object.keys(o) : []; });
        _def(_e, 'values', function(o) { return o && typeof o === 'object' ? Object.values(o) : []; });
        _def(_e, 'join', function(a, s) { return Array.isArray(a) ? a.join(s || ',') : String(a); });
        _def(_e, 'format', function() { var s = arguments[0]; for (var i = 1; i < arguments.length; i++) s = s.replace('%s', arguments[i]); return s; });
        _def(_e, 'typeof', _typeof);
        _def(_e, 'sizeof', _sizeof);
        _def(_e, 'isnil', function(x) { return x === null || x === undefined; });
        _def(_e, 'isnum', function(x) { return typeof x === 'number'; });
        _def(_e, 'isstr', function(x) { return typeof x === 'string'; });
        _def(_e, 'isarr', function(x) { return Array.isArray(x); });
        _def(_e, 'PI', Math.PI);
        _def(_e, 'E', Math.E);
        _def(_e, 'true', true);
        _def(_e, 'false', false);
        _def(_e, 'nil', null);
        _def(_e, 'show', function() { _vcg_print(Array.from(arguments), 'output-line'); return null; });
        _def(_e, 'print', function() { _vcg_print(Array.from(arguments), 'output-line'); return null; });
        _def(_e, 'input', function(p) { return prompt(p || 'input:') || ''; });

        // ── VCG v2 specific functions ──────────────────────────────
        _def(_e, 'map', function(fn, arr) {
            var result = [];
            for (var i = 0; i < arr.length; i++) {
                result.push(_call(fn, [arr[i]], _e));
            }
            return result;
        });
        _def(_e, 'filter', function(fn, arr) {
            var result = [];
            for (var i = 0; i < arr.length; i++) {
                if (_truthy(_call(fn, [arr[i]], _e))) result.push(arr[i]);
            }
            return result;
        });
        _def(_e, 'reduce', function(fn, init, arr) {
            var acc = init;
            for (var i = 0; i < arr.length; i++) {
                acc = _call(fn, [acc, arr[i]], _e);
            }
            return acc;
        });
        _def(_e, 'find', function(fn, arr) {
            for (var i = 0; i < arr.length; i++) {
                if (_truthy(_call(fn, [arr[i]], _e))) return arr[i];
            }
            return null;
        });
        _def(_e, 'unique', function(arr) {
            var seen = {};
            var result = [];
            for (var i = 0; i < arr.length; i++) {
                var key = arr[i];
                if (!seen[key]) { seen[key] = true;
                    result.push(key); }
            }
            return result;
        });
        _def(_e, 'sum', function(arr) {
            var s = 0;
            for (var i = 0; i < arr.length; i++) s += arr[i];
            return s;
        });
        _def(_e, 'avg', function(arr) {
            if (arr.length === 0) return 0;
            return _call(_e.sum, [arr], _e) / arr.length;
        });
        _def(_e, 'first', function(arr) { return arr.length > 0 ? arr[0] : null; });
        _def(_e, 'last', function(arr) { return arr.length > 0 ? arr[arr.length - 1] : null; });
        _def(_e, 'flat', function(arr) {
            var result = [];
            for (var i = 0; i < arr.length; i++) {
                if (Array.isArray(arr[i])) {
                    for (var j = 0; j < arr[i].length; j++) result.push(arr[i][j]);
                } else {
                    result.push(arr[i]);
                }
            }
            return result;
        });
        _def(_e, 'zip', function(arr1, arr2) {
            var result = [];
            var minLen = Math.min(arr1.length, arr2.length);
            for (var i = 0; i < minLen; i++) {
                result.push([arr1[i], arr2[i]]);
            }
            return result;
        });
        _def(_e, 'chunk', function(arr, size) {
            var result = [];
            for (var i = 0; i < arr.length; i += size) {
                result.push(arr.slice(i, i + size));
            }
            return result;
        });
        _def(_e, 'includes', function(str, sub) { return str.includes(sub); });
        _def(_e, 'indexof', function(str, sub) { return str.indexOf(sub); });
        _def(_e, 'count', function(str, ch) { return (str.match(new RegExp(ch, 'g')) || []).length; });
        _def(_e, 'pad_start', function(str, len, pad) { return String(str).padStart(len, pad); });
        _def(_e, 'pad_end', function(str, len, pad) { return String(str).padEnd(len, pad); });
        _def(_e, 'repeat', function(str, n) { return String(str).repeat(n); });
        _def(_e, 'merge', function(a, b) { var o = {}; for (var k in a) o[k] = a[k]; for (var k in b) o[k] = b[k]; return o; });
        _def(_e, 'has', function(obj, key) { return obj.hasOwnProperty(key); });
        _def(_e, 'entries', function(obj) { return Object.entries(obj); });
        _def(_e, 'gcd', function(a, b) { while (b) { var t = b;
                b = a % b;
                a = t; } return a; });
        _def(_e, 'lcm', function(a, b) { return (a / _call(_e.gcd, [a, b], _e)) * b; });
        _def(_e, 'fib', function(n) { if (n <= 1) return n; return _call(_e.fib, [n - 1], _e) + _call(_e.fib, [n - 2], _e); });
        _def(_e, 'factorial', function(n) { if (n <= 1) return 1; return n * _call(_e.factorial, [n - 1], _e); });
        _def(_e, 'is_prime', function(n) {
            if (n < 2) return false;
            if (n === 2) return true;
            if (n % 2 === 0) return false;
            for (var i = 3; i * i <= n; i += 2) { if (n % i === 0) return false; }
            return true;
        });
        _def(_e, 'TAU', 2 * Math.PI);
        _def(_e, 'PHI', (1 + Math.sqrt(5)) / 2);
        _def(_e, 'uuid', function() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0,
                    v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        });
        _def(_e, 'hash', function(s) {
            var h = 0;
            for (var i = 0; i < s.length; i++) {
                h = ((h << 5) - h) + s.charCodeAt(i);
                h |= 0;
            }
            return h;
        });
        _def(_e, 'JSON_stringify', function(v) { return JSON.stringify(v); });
        _def(_e, 'JSON_parse', function(s) { return JSON.parse(s); });

        // ── Assertion helpers ──────────────────────────────────────
        _def(_e, 'assert_eq', function(a, b) { if (!_vcg_eq(a, b)) throw new Error('assert_eq failed: ' + a + ' != ' + b); });
        _def(_e, 'assert_true', function(v) { if (!_truthy(v)) throw new Error('assert_true failed'); });
        _def(_e, 'assert_false', function(v) { if (_truthy(v)) throw new Error('assert_false failed'); });

        // ── Class / OOP support ────────────────────────────────────
        // We'll define a helper to create classes
        function _createClass(superClass, methods) {
            var cls = function() {
                var instance = Object.create(cls.prototype);
                if (typeof instance.init === 'function') {
                    instance.init.apply(instance, arguments);
                }
                return instance;
            };
            if (superClass) {
                cls.prototype = Object.create(superClass.prototype);
                cls.prototype.constructor = cls;
                cls.__super__ = superClass;

                cls.prototype = {};

            for (var key in methods) {
                cls.prototype[key] = methods[key];

        }

        // ── Module support ─────────────────────────────────────────
        // Modules are just objects with properties

        // ── Safe block support ─────────────────────────────────────
        // We'll handle safe blocks via try/catch

        // ── Test support ──────────────────────────────────────────
        // test blocks will be executed immediately

        // ============================================================
        //  USER PROGRAM — VCG v2.0 Concepts (Output Only)
        // ============================================================
        try {
            // ── Print header ──────────────────────────────────────
            _vcg_print_raw("Syrian VCG v2.0 — Full Edition", 'header-line');
            _vcg_print_raw("================================", 'divider');
            _vcg_print_raw("", '');

            // ── 1. Class & OOP ──────────────────────────────────
            _vcg_print_raw("=== 1. Class & OOP ===", 'section-title');

            // Define Animal class
            var Animal = _createClass(null, {
                init: function(name, sound) {
                    this.name = name;
                    this.sound = sound;
                },
                speak: function() {
                    return this.name + " says: " + this.sound;
                }
            });

            // Define Dog class extending Animal? Actually VCG code shows Dog as separate class
            var Dog = _createClass(null, {
                init: function(name) {
                    this.name = name;
                    this.sound = "Woof";
                },
                speak: function() {
                    return this.name + " barks: " + this.sound;
                },
                fetch: function(item) {
                    return this.name + " fetches the " + item;
                }
            });

            var dog = new Dog("Rex");
            _vcg_print([dog.speak()]);
            _vcg_print([dog.fetch("ball")]);
            _vcg_print([""]);

            // ── 2. Enum ──────────────────────────────────────────
            _vcg_print_raw("=== 2. Enum ===", 'section-title');
            var Color = Object.freeze({ Red: 0, Green: 1, Blue: 2, Yellow: 3 });
            var Direction = Object.freeze({ North: 0, South: 1, East: 2, West: 3 });
            var Status = Object.freeze({ Pending: 0, Active: 1, Done: 2, Failed: 3 });

            _vcg_print(["Color.Red    =", Color.Red]);
            _vcg_print(["Color.Green  =", Color.Green]);
            _vcg_print(["Color.Blue   =", Color.Blue]);
            _vcg_print(["Direction.North =", Direction.North]);
            _vcg_print(["Status.Done =", Status.Done]);
            _vcg_print([""]);

            // ── 3. Type Aliases ─────────────────────────────────
            _vcg_print_raw("=== 3. Type Aliases ===", 'section-title');
            var Point2D = { x: 0, y: 0 };
            var Callback = function() {};
            var NumberList = [];
            _vcg_print(["Point2D:", _typeof(Point2D)]);
            _vcg_print(["NumberList:", _typeof(NumberList)]);
            _vcg_print([""]);

            // ── 4. Modules ──────────────────────────────────────
            _vcg_print_raw("=== 4. Modules ===", 'section-title');
