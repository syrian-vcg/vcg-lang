html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#00ff41;
  font-family:'Courier New',monospace;
  overflow:hidden;
}
#terminal{
  width:100vw;
  height:100vh;
  background:#000;
  padding:2rem 3rem;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  overflow:hidden;
}
#out{
  width:100%;
  flex:1;
  font-size:1.1rem;
  line-height:2;
  overflow:hidden;
  position:relative;
}
.ln{
  display:block;
  padding:0.1rem 0.3rem;
  white-space:pre-wrap;
  word-break:break-all;
  opacity:0;
  animation:typing 0.05s ease forwards;
  font-family:'Courier New',monospace;
}
@keyframes typing{
  0%{opacity:0;transform:translateX(-5px);}
  100%{opacity:1;transform:translateX(0);}
}
.output-line{
  color:#00ff41;
}
.output-line:before{
  content:"→ ";
  color:#00ff41;
  opacity:0.3;
}
.header-line{
  color:#00ff41;
  font-weight:bold;
  text-shadow:0 0 30px rgba(0,255,65,0.15);
}
.header-line:before{
  content:"";
}
.divider{
  color:#004d1a;
  letter-spacing:2px;
  opacity:0.5;
}
.divider:before{
  content:"";
}
.error{
  color:#ff3333;
}
.error:before{
  content:"✗ ";
  color:#ff3333;
}
.cursor{
  display:inline-block;
  width:12px;
  height:24px;
  background:#00ff41;
  animation:blink 0.8s step-end infinite;
  vertical-align:middle;
  margin-left:4px;
  position:relative;
  top:2px;
}
@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0}
}
footer{
  color:#004d1a;
  font-size:0.8rem;
  letter-spacing:2px;
  padding:0.5rem 0;
  border-top:1px solid #004d1a;
  margin-top:0.5rem;
  opacity:0.5;
  text-align:center;
}
footer b{
  color:#00ff41;
}
