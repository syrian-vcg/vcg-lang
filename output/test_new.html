<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VCG v2.0 — Terminal</title>
    <!-- JSZip للتحميل التلقائي -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>
    <style>
        /* ===== Reset & Base ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0a0f0a;
            color: #00ff41;
            font-family: 'Courier New', 'Cairo', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* ===== Terminal Container ===== */
        #terminal {
            width: 100vw;
            height: 100vh;
            background: #0a0f0a;
            padding: 1.2rem 1.8rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 120px rgba(0, 255, 65, 0.02);
        }

        /* ===== Output Area ===== */
        #out {
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.7;
            overflow-y: auto;
            padding: 0.2rem 0.1rem 0.5rem 0.1rem;
            scroll-behavior: smooth;
            position: relative;
        }

        /* ===== Typing Animation ===== */
        .ln {
            display: block;
            padding: 0.05rem 0.15rem;
            opacity: 0;
            animation: fadeIn 0.12s ease forwards;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            text-align: left;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateX(-6px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== Line Styles ===== */
        .output-line {
            color: #00ff41;
        }
        .output-line::before {
            content: "› ";
            color: #00aa33;
            opacity: 0.5;
        }

        .header-line {
            color: #00ff41;
            font-weight: bold;
            text-shadow: 0 0 24px rgba(0, 255, 65, 0.12);
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }
        .header-line::before {
            content: "◆ ";
            color: #00aa33;
            opacity: 0.6;
        }

        .divider {
            color: #004d1a;
            letter-spacing: 2px;
            text-align: center;
            opacity: 0.5;
            font-size: 0.85rem;
        }
        .divider::before {
            content: "— ";
        }
        .divider::after {
            content: " —";
        }

        .error-line {
            color: #ff4444;
            background: rgba(255, 0, 0, 0.06);
            padding: 0.1rem 0.5rem;
            border-right: 2px solid #ff4444;
        }
        .error-line::before {
            content: "✗ ";
            color: #ff4444;
        }

        .success-line {
            color: #66ff88;
        }
        .success-line::before {
            content: "✓ ";
            color: #66ff88;
            opacity: 0.7;
        }

        .info-line {
            color: #44aaff;
        }
        .info-line::before {
            content: "ℹ ";
            color: #44aaff;
            opacity: 0.6;
        }

        /* ===== Cursor ===== */
        .cursor-wrap {
            display: inline-block;
            margin-top: 0.1rem;
            padding: 0.05rem 0;
        }
        .cursor {
            display: inline-block;
            width: 11px;
            height: 22px;
            background: #00ff41;
            animation: blink 0.9s step-end infinite;
            vertical-align: middle;
            margin-right: 2px;
            border-radius: 1px;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== Scrollbar ===== */
        #out::-webkit-scrollbar {
            width: 5px;
        }
        #out::-webkit-scrollbar-track {
            background: #0a0f0a;
        }
        #out::-webkit-scrollbar-thumb {
            background: #004d1a;
            border-radius: 3px;
        }
        #out::-webkit-scrollbar-thumb:hover {
            background: #00ff41;
        }

        /* ===== Responsive ===== */
        @media (max-width: 680px) {
            #terminal {
                padding: 0.8rem 1rem;
            }
            #out {
                font-size: 0.82rem;
                line-height: 1.6;
            }
            .header-line {
                font-size: 0.92rem;
            }
            .cursor {
                width: 9px;
                height: 18px;
            }
        }
        @media (max-width: 400px) {
            #terminal {
                padding: 0.4rem 0.6rem;
            }
            #out {
                font-size: 0.7rem;
                line-height: 1.5;
            }
            .output-line::before {
                content: ">";
            }
            .header-line::before {
                content: "• ";
            }
            .cursor {
                width: 7px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div id="out"></div>
        <!-- تم إخفاء الشريط السفلي والأزرار بالكامل -->
    </div>

    <script>
        // ================================================================
        //  VCG Runtime — v2.0  (Pure Terminal, No Footer)
        // ================================================================

        var _OUT = document.getElementById('out');
        var lineCounter = 0;
        var allOutputLines = [];
        var cursorElement = null;

        // ── Core printing with typing animation ──────────────────────

        function _vcg_print(arr, cls) {
            var parts = arr.map(function(v) {
                if (v === null) return 'nil';
                if (v === true) return 'true';
                if (v === false) return 'false';
                if (Array.isArray(v)) return '[' + v.map(String).join(', ') + ']';
                if (typeof v === 'object' && v !== null) return JSON.stringify(v);
                return String(v);
            });
            var s = parts.join(' ');
            var el = document.createElement('span');
            el.className = 'ln ' + (cls || 'output-line');
            el.style.animationDelay = (Math.min(lineCounter, 60) * 0.05) + 's';
            el.textContent = s;
            if (cursorElement) {
                _OUT.insertBefore(el, cursorElement);
            } else {
                _OUT.appendChild(el);
            }
            allOutputLines.push(s);
            lineCounter++;
            _OUT.scrollTop = _OUT.scrollHeight;
        }

        function _vcg_print_raw(s, cls) {
            var el = document.createElement('span');
            el.className = 'ln ' + (cls || '');
            el.style.animationDelay = (Math.min(lineCounter, 60) * 0.05) + 's';
            el.textContent = s;
            if (cursorElement) {
                _OUT.insertBefore(el, cursorElement);
            } else {
                _OUT.appendChild(el);
            }
            allOutputLines.push(s);
            lineCounter++;
            _OUT.scrollTop = _OUT.scrollHeight;
        }

        // ── Cursor management ─────────────────────────────────────────

        function _ensureCursor() {
            if (cursorElement) return;
            var wrap = document.createElement('span');
            wrap.className = 'cursor-wrap';
            var cur = document.createElement('span');
            cur.className = 'cursor';
            wrap.appendChild(cur);
            _OUT.appendChild(wrap);
            cursorElement = wrap;
        }

        function _removeCursor() {
            if (cursorElement && cursorElement.parentNode) {
                cursorElement.parentNode.removeChild(cursorElement);
                cursorElement = null;
            }
        }

        // ── Header / divider helpers ──────────────────────────────────

        function _hdr(s) {
            _vcg_print_raw(s, 'header-line');
        }

        function _div() {
            _vcg_print_raw('', 'divider');
        }

        function _success(s) {
            _vcg_print_raw(s, 'success-line');
        }

        function _info(s) {
            _vcg_print_raw(s, 'info-line');
        }

        // ── VCG runtime helpers ──────────────────────────────────────

        function _truthy(v) {
            return v !== null && v !== false && v !== 0 && v !== '' && v !== undefined;
        }

        function _bin(op, a, b) {
            if (op === '+' && (typeof a === 'string' || typeof b === 'string')) return String(a) + String(b);
            if (op === '+' && Array.isArray(a) && Array.isArray(b)) return a.concat(b);
            if (op === '..') {
                var r = [],
                    f = Math.floor(a),
                    t = Math.floor(b),
                    s = f <= t ? 1 : -1;
                for (var i = f; s > 0 ? i <= t : i >= t; i += s) r.push(i);
                return r;
            }
            switch (op) {
                case '+':
                    return a + b;
                case '-':
                    return a - b;
                case '*':
                    return a * b;
                case '/':
                    if (b === 0) throw new Error('Division by zero');
                    return a / b;
                case '%':
                    if (b === 0) throw new Error('Modulo by zero');
                    return a % b;
                case '**':
                    return Math.pow(a, b);
                case '==':
                    return a == b;
                case '!=':
                    return a != b;
                case '<':
                    return a < b;
                case '>':
                    return a > b;
                case '<=':
                    return a <= b;
                case '>=':
                    return a >= b;
                case 'and':
                    return _truthy(a) && _truthy(b);
                case 'or':
                    return _truthy(a) || _truthy(b);
                case '|':
                    return (a | 0) | (b | 0);
                case '&':
                    return (a | 0) & (b | 0);
                case '<<':
                    return (a | 0) << (b | 0);
                case '>>':
                    return (a | 0) >> (b | 0);
            }
            return null;
        }

        function _scope(p) { return Object.create(p || null); }

        function _def(e, k, v) {
            Object.defineProperty(e, k, { value: v, writable: true, configurable: true, enumerable: true });
            return v;
        }

        function _set(e, k, v) {
            var c = e;
            while (c) {
                if (Object.prototype.hasOwnProperty.call(c, k)) { c[k] = v; return v; }
                c = Object.getPrototypeOf(c);
            }
            e[k] = v;
            return v;
        }

        function _v(k, e) {
            var c = e;
            while (c) {
                if (k in c) return c[k];
                c = Object.getPrototypeOf(c);
            }
            throw new Error('Undefined: ' + k);
        }

        function _call(f, args, e) {
            if (typeof f === 'function') return f.apply(null, args);
            throw new Error('Not callable');
        }

        function _method(obj, name, args, e) {
            if (Array.isArray(obj)) {
                if (name === 'push') { obj.push.apply(obj, args); return obj.length; }
                if (name === 'pop') return obj.pop();
                if (name === 'len' || name === 'length') return obj.length;
                if (name === 'join') return obj.join(args[0] !== undefined ? args[0] : ',');
                if (name === 'contains') return obj.indexOf(args[0]) >= 0;
                if (name === 'reverse') { obj.reverse(); return obj; }
                if (name === 'slice') return obj.slice(args[0] || 0, args[1]);
                if (name === 'sort') { obj.sort(function(a, b) { return a - b; }); return obj; }
            }
            if (typeof obj === 'string') {
                if (name === 'len' || name === 'length') return obj.length;
                if (name === 'upper') return obj.toUpperCase();
                if (name === 'lower') return obj.toLowerCase();
                if (name === 'trim') return obj.trim();
                if (name === 'split') return obj.split(args[0] !== undefined ? args[0] : ' ');
                if (name === 'contains') return obj.includes(String(args[0]));
                if (name === 'startswith') return obj.startsWith(String(args[0]));
                if (name === 'endswith') return obj.endsWith(String(args[0]));
                if (name === 'replace') return obj.replaceAll(String(args[0]), String(args[1]));
                if (name === 'tonum') return parseFloat(obj);
                if (name === 'indexof') return obj.indexOf(String(args[0]));
            }
            if (obj && typeof obj === 'object' && typeof obj[name] === 'function') return obj[name].apply(obj, args);
            throw new Error('No method: ' + name);
        }

        // ── Stdlib ────────────────────────────────────────────────────

        var _e = _scope(null);
        _def(_e, 'abs', function(x) { return Math.abs(x); });
        _def(_e, 'floor', function(x) { return Math.floor(x); });
        _def(_e, 'ceil', function(x) { return Math.ceil(x); });
        _def(_e, 'round', function(x) { return Math.round(x); });
        _def(_e, 'sqrt', function(x) { return Math.sqrt(x); });
        _def(_e, 'pow', function(b, e2) { return Math.pow(b, e2); });
        _def(_e, 'log', function(x) { return Math.log(x); });
        _def(_e, 'log2', function(x) { return Math.log2(x); });
        _def(_e, 'log10', function(x) { return Math.log10(x); });
        _def(_e, 'sin', function(x) { return Math.sin(x); });
        _def(_e, 'cos', function(x) { return Math.cos(x); });
        _def(_e, 'tan', function(x) { return Math.tan(x); });
        _def(_e, 'min', function() { return Math.min.apply(null, arguments); });
        _def(_e, 'max', function() { return Math.max.apply(null, arguments); });
        _def(_e, 'clamp', function(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); });
        _def(_e, 'rand', function(a, b) {
            if (a === undefined) return Math.random();
            if (b === undefined) return Math.floor(Math.random() * a);
            return Math.floor(Math.random() * (b - a)) + a;
        });
        _def(_e, 'range', function(a, b, s) {
            var r = [],
                f = b === undefined ? 0 : a,
                t = b === undefined ? a : b,
                st = s || 1;
            for (var i = f; i < t; i += st) r.push(i);
            return r;
        });
        _def(_e, 'len', function(x) {
            if (Array.isArray(x)) return x.length;
            if (typeof x === 'string') return x.length;
            if (x && typeof x === 'object') return Object.keys(x).length;
            return 0;
        });
        _def(_e, 'str', function(x) {
            return x === null ? 'nil' :
                x === true ? 'true' :
                x === false ? 'false' :
                Array.isArray(x) ? '[' + x.map(String).join(', ') + ']' :
                String(x);
        });
        _def(_e, 'int', function(x) { return parseInt(x) || 0; });
        _def(_e, 'float', function(x) { return parseFloat(x) || 0; });
        _def(_e, 'bool', function(x) { return _truthy(x); });
        _def(_e, 'char', function(n) { return String.fromCharCode(n); });
        _def(_e, 'ord', function(s) { return s ? s.charCodeAt(0) : 0; });
        _def(_e, 'keys', function(o) { return o && typeof o === 'object' ? Object.keys(o) : []; });
        _def(_e, 'values', function(o) { return o && typeof o === 'object' ? Object.values(o) : []; });
        _def(_e, 'join', function(a, s) { return Array.isArray(a) ? a.join(s || ',') : String(a); });
        _def(_e, 'format', function() {
            var s = arguments[0];
            for (var i = 1; i < arguments.length; i++) s = s.replace('%s', arguments[i]);
            return s;
        });
        _def(_e, 'typeof', function(v) {
            if (v === null) return 'nil';
            if (Array.isArray(v)) return 'array';
            return typeof v;
        });
        _def(_e, 'sizeof', function(v) {
            if (Array.isArray(v)) return v.length;
            if (typeof v === 'string') return v.length;
            if (v && typeof v === 'object') return Object.keys(v).length;
            return 1;
        });
        _def(_e, 'isnil', function(x) { return x === null || x === undefined; });
        _def(_e, 'isnum', function(x) { return typeof x === 'number'; });
        _def(_e, 'isstr', function(x) { return typeof x === 'string'; });
        _def(_e, 'isarr', function(x) { return Array.isArray(x); });
        _def(_e, 'PI', Math.PI);
        _def(_e, 'E', Math.E);
        _def(_e, 'true', true);
        _def(_e, 'false', false);
        _def(_e, 'nil', null);
        _def(_e, 'show', function() { _vcg_print(Array.from(arguments), 'output-line'); return null; });
        _def(_e, 'print', function() { _vcg_print(Array.from(arguments), 'output-line'); return null; });
        _def(_e, 'input', function(p) { return prompt(p || 'input:') || ''; });

        // ── v2.0 extended features ──────────────────────────────────

        function _enum(obj) { return Object.freeze(obj); }

        _def(_e, 'map', function(fn, arr) {
            var r = [];
            for (var i = 0; i < arr.length; i++) { r.push(_call(fn, [arr[i]], _e)); }
            return r;
        });
        _def(_e, 'filter', function(fn, arr) {
            var r = [];
            for (var i = 0; i < arr.length; i++) { if (_truthy(_call(fn, [arr[i]], _e))) r.push(arr[i]); }
            return r;
        });
        _def(_e, 'reduce', function(fn, init, arr) {
            var acc = init;
            for (var i = 0; i < arr.length; i++) { acc = _call(fn, [acc, arr[i]], _e); }
            return acc;
        });
        _def(_e, 'find', function(fn, arr) {
            for (var i = 0; i < arr.length; i++) { if (_truthy(_call(fn, [arr[i]], _e))) return arr[i]; }
            return null;
        });

        _def(_e, 'unique', function(arr) { return Array.from(new Set(arr)); });
        _def(_e, 'sum', function(arr) { var t = 0; for (var i = 0; i < arr.length; i++) t += arr[i]; return t; });
        _def(_e, 'avg', function(arr) { return arr.length === 0 ? 0 : _call(_e.sum, [arr], _e) / arr.length; });
        _def(_e, 'first', function(arr) { return arr.length > 0 ? arr[0] : null; });
        _def(_e, 'last', function(arr) { return arr.length > 0 ? arr[arr.length - 1] : null; });
        _def(_e, 'flat', function(arr) {
            var r = [];
            for (var i = 0; i < arr.length; i++) {
                if (Array.isArray(arr[i])) { for (var j = 0; j < arr[i].length; j++) r.push(arr[i][j]); } else { r.push(arr[
                    i]); }
            }
            return r;
        });
        _def(_e, 'zip', function(a, b) {
            var r = [],
                m = Math.min(a.length, b.length);
            for (var i = 0; i < m; i++) r.push([a[i], b[i]]);
            return r;
        });
        _def(_e, 'chunk', function(arr, size) {
            var r = [];
            for (var i = 0; i < arr.length; i += size) r.push(arr.slice(i, i + size));
            return r;
        });

        _def(_e, 'assert_eq', function(a, b) {
            if (!(a == b)) throw new Error('assert_eq failed: ' + a + ' != ' + b);
        });
        _def(_e, 'assert_true', function(v) { if (!_truthy(v)) throw new Error('assert_true failed'); });
        _def(_e, 'assert_false', function(v) { if (_truthy(v)) throw new Error('assert_false failed'); });

        _def(_e, 'includes', function(s, sub) { return s.includes(sub); });
        _def(_e, 'indexof', function(s, sub) { return s.indexOf(sub); });
        _def(_e, 'count', function(s, ch) { return (s.match(new RegExp(ch, 'g')) || []).length; });
        _def(_e, 'pad_start', function(s, len, pad) { return String(s).padStart(len, pad); });
        _def(_e, 'pad_end', function(s, len, pad) { return String(s).padEnd(len, pad); });
        _def(_e, 'repeat', function(s, n) { return String(s).repeat(n); });

        _def(_e, 'merge', function(a, b) {
            var o = {};
            for (var k in a) o[k] = a[k];
            for (var k in b) o[k] = b[k];
            return o;
        });
        _def(_e, 'has', function(obj, key) { return obj.hasOwnProperty(key); });
        _def(_e, 'entries', function(obj) { return Object.entries(obj); });

        _def(_e, 'gcd', function(a, b) { while (b) { var t = b;
                b = a % b;
                a = t; } return a; });
        _def(_e, 'lcm', function(a, b) { return (a / _call(_e.gcd, [a, b], _e)) * b; });
        _def(_e, 'fib', function(n) {
            if (n <= 1) return n;
            return _call(_e.fib, [n - 1], _e) + _call(_e.fib, [n - 2], _e);
        });
        _def(_e, 'factorial', function(n) {
            if (n <= 1) return 1;
            return n * _call(_e.factorial, [n - 1], _e);
        });
        _def(_e, 'is_prime', function(n) {
            if (n < 2) return false;
            if (n === 2) return true;
            if (n % 2 === 0) return false;
            for (var i = 3; i * i <= n; i += 2) { if (n % i === 0) return false; }
            return true;
        });
        _def(_e, 'TAU', 2 * Math.PI);
        _def(_e, 'PHI', (1 + Math.sqrt(5)) / 2);
        _def(_e, 'uuid', function() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0,
                    v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        });
        _def(_e, 'hash', function(s) {
            var h = 0;
            for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i);
                h |= 0; }
            return h;
        });

        _def(_e, 'JSON_stringify', function(v) { return JSON.stringify(v); });
        _def(_e, 'JSON_parse', function(s) { return JSON.parse(s); });

        // ── The VCG Demo Program ─────────────────────────────────────

        _ensureCursor();

        try {

            _hdr('Syrian VCG v2.0 — Full Edition');
            _hdr('================================');
            _vcg_print_raw('', '');

            // ── 1. Class & OOP ──────────────────────────────────────

            _hdr('=== 1. Class & OOP ===');

            function Animal(name, sound) {
                this.name = name;
                this.sound = sound;
            }
            Animal.prototype.speak = function() { return this.name + ' says: ' + this.sound; };

            function Dog(name) {
                this.name = name;
                this.sound = 'Woof';
            }
            Dog.prototype.speak = function() { return this.name + ' barks: ' + this.sound; };
            Dog.prototype.fetch = function(item) { return this.name + ' fetches the ' + item; };

            var dog = new Dog('Rex');
            _vcg_print([dog.speak()]);
            _vcg_print([dog.fetch('ball')]);
            _vcg_print_raw('', '');

            // ── 2. Enum ──────────────────────────────────────────────

            _hdr('=== 2. Enum ===');
            var Color = _enum({ Red: 0, Green: 1, Blue: 2, Yellow: 3 });
            var Direction = _enum({ North: 0, South: 1, East: 2, West: 3 });
            var Status = _enum({ Pending: 0, Active: 1, Done: 2, Failed: 3 });
            _vcg_print(['Color.Red    =', Color.Red]);
            _vcg_print(['Color.Green  =', Color.Green]);
            _vcg_print(['Color.Blue   =', Color.Blue]);
            _vcg_print(['Direction.North =', Direction.North]);
            _vcg_print(['Status.Done =', Status.Done]);
            _vcg_print_raw('', '');

            // ── 3. Type Aliases ──────────────────────────────────────

            _hdr('=== 3. Type Aliases ===');
            var Point2D = { x: 0, y: 0 };
            var NumberList = [];
