name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Android SDK ───────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Gradle permissions ────────────────────────────
      - name: Make gradlew executable
        run: chmod +x editor/android/gradlew || chmod +x ./gradlew
        continue-on-error: true

      # ── 5. Cache Gradle ──────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 6. Build Debug APK ───────────────────────────────
      - name: Build Debug APK
        working-directory: editor/android
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found, attempting to create it..."
            gradle wrapper --gradle-version=8.0
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      # ── 7. Build Release APK (unsigned) ──────────────────
      - name: Build Release APK
        working-directory: editor/android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version=8.0
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      # ── 8. Rename APKs ───────────────────────────────────
      - name: Rename APK files
        run: |
          mkdir -p apk-output
          if [ -d "editor/android/app/build/outputs/apk" ]; then
            find editor/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
              if [ -f "$f" ]; then
                fname=$(basename "$f")
                cp "$f" "apk-output/vcg-editor-${fname}"
                echo "Copied: $fname"
              fi
            done
          else
            echo "APK output directory not found"
          fi
          ls -la apk-output/ 2>/dev/null || echo "No APK files found"
        continue-on-error: true

      # ── 9. Upload Debug APK artifact ─────────────────────
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-debug-apk
          path: apk-output/vcg-editor-*debug*.apk
          retention-days: 30
        continue-on-error: true

      # ── 10. Upload Release APK artifact ──────────────────
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: apk-output/vcg-editor-*release*.apk
          retention-days: 30
        continue-on-error: true

      # ── 11. Upload to GitHub Release ─────────────────────
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk-output/vcg-editor-*debug*.apk
            apk-output/vcg-editor-*release*.apk
        continue-on-error: true

  # ── Sign APK (optional, needs keystore secret) ───────────
  sign-apk:
    name: Sign Release APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.KEYSTORE_BASE64 != ''

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: apk-to-sign/

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > vcg-release.keystore
          find apk-to-sign -name "*.apk" -type f | while read apk; do
            if [ -f "$apk" ]; then
              jarsigner -verbose \
                -sigalg SHA256withRSA \
                -digestalg SHA-256 \
                -keystore vcg-release.keystore \
                -storepass "${{ secrets.KEYSTORE_PASS }}" \
                -keypass "${{ secrets.KEY_PASS }}" \
                "$apk" "${{ secrets.KEY_ALIAS }}"
              echo "Signed: $apk"
            fi
          done
        continue-on-error: true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-signed-apk
          path: apk-to-sign/*.apk
          retention-days: 30
        continue-on-error: true
