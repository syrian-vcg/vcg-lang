name: Publish VCG SDK to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:   # يسمح بتشغيله يدوياً من تبويب Actions أيضاً

permissions:
  contents: read
  packages: write       # ضروري لرفع الحزمة إلى GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish package
        run: ./gradlew :sdk:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
