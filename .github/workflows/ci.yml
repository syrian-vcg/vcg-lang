name: VCG CI/CD v2.0

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  # ─────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC & Make
        run: sudo apt-get update -qq && sudo apt-get install -y gcc make

      - name: Build VCG compiler
        run: |
          make all
          chmod +x vcgc

      - name: Version check
        run: ./vcgc --version | grep "2.0.0"

      - name: Compile all examples
        run: make examples

      - name: Run test suite
        run: cd tests && bash run_tests.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcgc-linux-amd64
          path: |
            vcgc
            output/*.html
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install & Build
        run: |
          sudo apt-get install -y gcc make
          make all && chmod +x vcgc && make examples

      - name: Build site
        run: |
          mkdir -p _site/assets _site/examples
          cp github/pages/index.html _site/index.html
          [ -f assets/icon.svg ] && cp assets/icon.svg _site/assets/
          [ -f assets/icon.png ] && cp assets/icon.png _site/assets/
          for f in output/*.html; do [ -f "$f" ] && cp "$f" _site/examples/; done
          echo "Site contents:"; find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────────────
  release:
    name: Create Release Asset
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get install -y gcc make
          make all && chmod +x vcgc
      - name: Package
        run: |
          tar -czf vcg-lang-v2.0.0-linux-amd64.tar.gz \
            vcgc Makefile README.md LICENSE CHANGELOG.md \
            compiler/ examples/ tools/ assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: vcg-lang-v2.0.0-linux-amd64.tar.gz
