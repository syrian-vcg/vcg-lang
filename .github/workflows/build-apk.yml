name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          chmod +x editor/android/gradlew
          ls -la editor/android/gradlew

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: editor/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Build Release APK
        working-directory: editor/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Create APK output directory
        run: |
          mkdir -p apk-output
          find editor/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            name=$(basename "$f")
            cp "$f" "apk-output/vcg-editor-${name}"
            echo "Copied: $name"
          done
          echo "=== APK files ==="
          ls -lh apk-output/ || echo "No APK files found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-debug-apk
          path: apk-output/*debug*.apk
          retention-days: 30
        continue-on-error: true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: apk-output/*release*.apk
          retention-days: 30
        continue-on-error: true

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
        continue-on-error: true

  sign-apk:
    name: Sign Release APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: apk-to-sign/
        continue-on-error: true

      - name: Sign APK (if keystore secret exists)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "No keystore secret found, skipping signing"
            exit 0
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > vcg-release.keystore
          find apk-to-sign -name "*.apk" | while read apk; do
            "$JAVA_HOME/bin/jarsigner" -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore vcg-release.keystore \
              -storepass "${{ secrets.KEYSTORE_PASS }}" \
              -keypass "${{ secrets.KEY_PASS }}" \
              "$apk" "${{ secrets.KEY_ALIAS }}"
            echo "Signed: $apk"
          done

      - name: Upload Signed APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-signed-apk
          path: apk-to-sign/*.apk
          retention-days: 30
        continue-on-error: true
