name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Fix Line Endings (CRLF to LF) & Executable Permission
        run: |
          if [ -f "editor/android/gradlew" ]; then
            sed -i 's/\r$//' editor/android/gradlew
            chmod +x editor/android/gradlew
          fi

      - name: Verify Gradle Wrapper or Fallback
        working-directory: editor/android
        run: |
          ./gradlew --version || {
            echo "Gradle wrapper check failed. Regenerating clean Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
            ./gradlew --version
          }

      - name: Fix Adaptive Icons & Build Configuration (Self-Healing)
        run: |
          echo "=== Starting Automatic Build Optimization ==="
          
          ROOT_GRADLE="editor/android/build.gradle"
          APP_GRADLE="editor/android/app/build.gradle"
          
          echo "=== Auditing Root and App build.gradle files ==="
          
          # If ROOT_GRADLE is corrupted or acts as an app config (template mismatch check)
          if [ ! -f "$ROOT_GRADLE" ] || grep -q "compileSdk" "$ROOT_GRADLE" || grep -q "namespace" "$ROOT_GRADLE" || ! grep -q "apply false" "$ROOT_GRADLE"; then
            echo "Detected corrupted/swapped root build.gradle! Re-generating correct root build.gradle..."
            cat << 'EOF' > "$ROOT_GRADLE"
// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.2.2' apply false
}
EOF
          fi

          # If APP_GRADLE does not exist, or is corrupted due to duplicate commits
          if [ ! -f "$APP_GRADLE" ] || ! grep -q "android {" "$APP_GRADLE"; then
            echo "Detected missing or corrupted app/build.gradle! Generating correct app/build.gradle..."
            cat << 'EOF' > "$APP_GRADLE"
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.syrianvcg.editor'
    compileSdk 34

    defaultConfig {
        applicationId "com.syrianvcg.editor"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
EOF
          else
            echo "Upgrading minSdk to 26 in app/build.gradle..."
            sed -i 's/minSdk [0-9]\+/minSdk 26/g' "$APP_GRADLE"
          fi

          echo "=== Audited files preview ==="
          cat "$ROOT_GRADLE"

          # 2. Correctly structure adaptive icon XMLs
          RES_ROOT="editor/android/app/src/main/res"
          ANYDPI_DIR="$RES_ROOT/mipmap-anydpi-v26"
          mkdir -p "$ANYDPI_DIR"
          
          for density in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -d "$RES_ROOT/$density" ]; then
              find "$RES_ROOT/$density" -maxdepth 1 -name "ic_launcher*.xml" -exec mv -t "$ANYDPI_DIR" {} + 2>/dev/null || true
            fi
          done

      - name: Build Debug APK
        working-directory: editor/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Build Release APK
        working-directory: editor/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find editor/android/app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ ;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-debug-apk
          path: apk-output/*debug*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-release-apk
          path: apk-output/*release*.apk
          retention-days: 30
