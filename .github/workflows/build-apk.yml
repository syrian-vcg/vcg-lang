name: Build VCG Editor APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Editor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Correct and Format build.gradle
        run: |
          echo "=== Auto-correcting editor/android/app/build.gradle formatting and syntax ==="
          mkdir -p editor/android/app
          cat > editor/android/app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.syrianvcg.editor'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.syrianvcg.editor'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF
          echo "=== Updated file contents ==="
          cat editor/android/app/build.gradle

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Gradle
        run: |
          if [ -d "editor/android" ]; then
            cd editor/android
            echo "Converting potential Windows CRLF line endings in gradlew..."
            sed -i 's/\r$//' gradlew
            echo "Granting executable permissions to Gradle wrapper..."
            chmod +x gradlew
            echo "Building Debug APK..."
            ./gradlew assembleDebug
          else
            echo "Error: Directory 'editor/android' not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-debug-apk
          path: editor/android/app/build/outputs/apk/debug/*.apk
