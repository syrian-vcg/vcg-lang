name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Fix Line Endings (CRLF to LF) & Executable Permission
        run: |
          if [ -f "editor/android/gradlew" ]; then
            sed -i 's/\r$//' editor/android/gradlew
            chmod +x editor/android/gradlew
          fi

      - name: Verify Gradle Wrapper or Fallback
        working-directory: editor/android
        run: |
          # If gradlew fails or is corrupted, regenerate it using the preinstalled Gradle 8.4
          ./gradlew --version || {
            echo "Gradle wrapper check failed. Regenerating clean Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
            ./gradlew --version
          }

      - name: Fix Adaptive Icons & Build Configuration
        run: |
          echo "=== Starting Automatic Build Optimization ==="
          
          # 1. Update minSdk to 26 to satisfy AAPT requirements for adaptive-icon
          BUILD_GRADLE="editor/android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Upgrading minSdk from 24 to 26 in $BUILD_GRADLE to support adaptive icon xml elements..."
            sed -i 's/minSdk [0-9]\+/minSdk 26/g' "$BUILD_GRADLE"
            cat "$BUILD_GRADLE" | grep minSdk || true
          else
            echo "Error: $BUILD_GRADLE not found."
          fi

          # 2. Correctly structure adaptive icon XMLs by moving them to mipmap-anydpi-v26
          RES_ROOT="editor/android/app/src/main/res"
          ANYDPI_DIR="$RES_ROOT/mipmap-anydpi-v26"
          mkdir -p "$ANYDPI_DIR"
          
          echo "Restructuring launcher icons..."
          for density in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -d "$RES_ROOT/$density" ]; then
              # Find XML adaptive launcher icons and safely move them to mipmap-anydpi-v26
              find "$RES_ROOT/$density" -maxdepth 1 -name "ic_launcher*.xml" -exec mv -t "$ANYDPI_DIR" {} + 2>/dev/null && echo "Moved XML icons from $density to mipmap-anydpi-v26" || true
            fi
          done

          # 3. List files to confirm successful restructuring
          echo "Current mipmap-anydpi-v26 directory content:"
          ls -la "$ANYDPI_DIR" || true

      - name: Build Debug APK
        working-directory: editor/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Build Release APK
        working-directory: editor/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find editor/android/app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ \;
          echo "=== APK files ==="
          ls -lh apk-output/ || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-debug-apk
          path: apk-output/*debug*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-release-apk
          path: apk-output/*release*.apk
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
        continue-on-error: true

  sign-apk:
    name: Sign APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: to-sign/
        continue-on-error: true

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore configured — skipping signing"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          find to-sign -name "*.apk" | while read apk; do
            $JAVA_HOME/bin/jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              "$apk" "$KEY_ALIAS"
          done
        continue-on-error: true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-signed-apk
          path: to-sign/*.apk
          retention-days: 30
        continue-on-error: true
