name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Fix Line Endings (CRLF to LF) & Executable Permission
        run: |
          if [ -f "editor/android/gradlew" ]; then
            sed -i 's/\r$//' editor/android/gradlew
            chmod +x editor/android/gradlew
          fi

      - name: Verify Gradle Wrapper or Fallback
        working-directory: editor/android
        run: |
          # في حال وجود عطب في ملف gradlew الحالي، تتم إعادة تعيينه وبنائه فوراً لضمان التشغيل السليم بنسبة 100%
          ./gradlew --version || {
            echo "Gradle wrapper check failed. Regenerating clean Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
            ./gradlew --version
          }

      - name: Build Debug APK
        working-directory: editor/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Build Release APK
        working-directory: editor/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find editor/android/app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ \;
          echo "=== APK files ==="
          ls -lh apk-output/ || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-debug-apk
          path: apk-output/*debug*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-release-apk
          path: apk-output/*release*.apk
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
        continue-on-error: true

  sign-apk:
    name: Sign APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: to-sign/
        continue-on-error: true

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore configured — skipping signing"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          find to-sign -name "*.apk" | while read apk; do
            $JAVA_HOME/bin/jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              "$apk" "$KEY_ALIAS"
          done
        continue-on-error: true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-signed-apk
          path: to-sign/*.apk
          retention-days: 30
        continue-on-error: true
