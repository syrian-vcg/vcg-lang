name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x editor/android/gradlew

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: editor/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: editor/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find editor/android/app/build/outputs/apk -name "*.apk" \
            -exec cp {} apk-output/vcg-editor-{} \;
          ls -la apk-output/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-debug-apk
          path: apk-output/*debug*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: apk-output/*release*.apk
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk

  sign-apk:
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && secrets.KEYSTORE_BASE64 != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: to-sign/
      - name: Sign
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          find to-sign -name "*.apk" -exec jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASS }}" \
            -keypass "${{ secrets.KEY_PASS }}" \
            {} "${{ secrets.KEY_ALIAS }}" \;
      - uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-signed-apk
          path: to-sign/*.apk
