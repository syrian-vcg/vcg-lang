name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x editor/android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Debug APK
        working-directory: editor/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Build Release APK
        working-directory: editor/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find editor/android/app/build/outputs/apk -name "*.apk" 2>/dev/null \
            -exec cp {} apk-output/ \; || true
          echo "=== APK Output ==="; ls -lh apk-output/ || echo "No APKs"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-debug-${{ github.sha }}
          path: apk-output/*debug*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-release-${{ github.sha }}
          path: apk-output/*release*.apk
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
        continue-on-error: true

  sign-apk:
    name: Sign APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && secrets.KEYSTORE_BASE64 != ''

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: vcg-editor-release-${{ github.sha }}
          path: to-sign/
        continue-on-error: true

      - name: Sign APK
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then exit 0; fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          find to-sign -name "*.apk" | while read apk; do
            $JAVA_HOME/bin/jarsigner -verbose \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "${{ secrets.KEYSTORE_PASS }}" \
              -keypass "${{ secrets.KEY_PASS }}" \
              "$apk" "${{ secrets.KEY_ALIAS }}"
          done
        continue-on-error: true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-signed-${{ github.sha }}
          path: to-sign/*.apk
          retention-days: 30
        continue-on-error: true
