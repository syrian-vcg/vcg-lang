name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x editor/android/gradlew

      - name: Clean stale build outputs
        working-directory: editor/android
        run: ./gradlew clean --no-daemon

      - name: Create local.properties from secrets
        working-directory: editor/android
        run: |
          cat > local.properties <<EOF
          ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_UNIT_ID=${{ secrets.ADMOB_REWARDED_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID=${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
          ADMOB_BANNER_UNIT_ID=${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_REWARDED_INTERSTITIAL_UNIT_ID=${{ secrets.ADMOB_REWARDED_INTERSTITIAL_UNIT_ID }}
          EOF

      - name: Build Debug APK
        working-directory: editor/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx2048m
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Release APK
        working-directory: editor/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx2048m
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        continue-on-error: true

      - name: Remove local.properties (cleanup secret file)
        if: always()
        working-directory: editor/android
        run: rm -f local.properties

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find editor/android/app/build/outputs/apk -name "*.apk" 2>/dev/null \
            -exec cp {} apk-output/ \; || true
          echo "=== APK files ==="
          ls -lh apk-output/ || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-debug-apk
          path: apk-output/*debug*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcg-editor-release-apk
          path: apk-output/*release*.apk
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
        continue-on-error: true

  sign-apk:
    name: Sign APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: to-sign/
        continue-on-error: true

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore configured — skipping signing"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          find to-sign -name "*.apk" | while read apk; do
            $JAVA_HOME/bin/jarsigner -verbose \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              "$apk" "$KEY_ALIAS"
          done
        continue-on-error: true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-signed-apk
          path: to-sign/*.apk
          retention-days: 30
        continue-on-error: true
