name: Build VCG Editor APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Editor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Gradle
        run: |
          if [ -d "editor/android" ]; then
            cd editor/android
            echo "Granting executable permissions to Gradle wrapper..."
            chmod +x gradlew
            echo "Building Debug APK..."
            ./gradlew assembleDebug
          else
            echo "Error: Directory 'editor/android' not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-debug-apk
          path: editor/android/app/build/outputs/apk/debug/*.apk
