name: Android Build & Download (Debug)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك بدء البناء يدوياً من واجهة GitHub

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # ⚡ تسريع بناء التطبيق بحفظ مكتبات Gradle مؤقتاً

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug # يولد ملف APK قابل للتثبيت فوراً للمبرمجين

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-version
          path: editor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
