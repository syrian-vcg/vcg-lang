name: Build Android APK for Editor

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Editor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web Editor
        run: |
          if [ -d "editor" ]; then
            cd editor
            echo "Installing dependencies inside editor..."
            npm install --legacy-peer-deps
            
            echo "Building static web assets..."
            if grep -q '"build"' package.json; then
              npm run build || echo "No custom build or failed, continuing..."
            fi
          else
            echo "Error: Directory 'editor' not found!"
            exit 1
          fi

      - name: Set up Capacitor & Sync Android
        run: |
          cd editor
          
          # Install capacitor dependencies if they are not already installed
          echo "Installing Capacitor..."
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

          # Detemine build/web output directory (commonly 'dist', 'build', or 'public')
          WEB_DIR="dist"
          if [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "public" ]; then
            WEB_DIR="public"
          fi
          echo "Web Assets Directory is: $WEB_DIR"

          # Initialize Capacitor if config doesn't exist
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo "Initializing Capacitor config..."
            npx cap init "VCG Editor" "com.syrianvcg.editor" --web-dir=$WEB_DIR
          fi

          # Add Android platform if it doesn't exist
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          fi

          # Sync assets to native project
          echo "Syncing assets..."
          npx cap sync android

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Gradle
        run: |
          cd editor/android
          echo "Granting permissions & building APK..."
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
