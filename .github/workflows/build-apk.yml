name: Build VCG Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Xmx2048m -XX:+UseG1GC"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: 'editor/android/gradle.properties'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x editor/android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('editor/android/**/*.gradle*', 'editor/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: editor/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: editor/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Create APK output directory
        run: |
          mkdir -p apk-output
          find editor/android/app/build/outputs/apk -name "*.apk" -type f \
            -exec cp {} apk-output/ \;
          ls -lah apk-output/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-debug-apk
          path: apk-output/*debug*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: apk-output/*release*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          draft: false
          prerelease: false

  sign-apk:
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: vcg-editor-release-apk
          path: to-sign/

      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          
          for apk in to-sign/*.apk; do
            echo "Signing: $apk"
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEY_PASS" \
              "$apk" "$KEY_ALIAS"
          done
          
          rm -f release.keystore

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vcg-editor-signed-apk
          path: to-sign/*.apk
          retention-days: 30
