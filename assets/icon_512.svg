<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a0a"/>
      <stop offset="100%" stop-color="#2d5a1b"/>
    </linearGradient>
    <linearGradient id="star512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f5e0"/>
    </linearGradient>
    <filter id="glow512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow512">
      <feDropShadow dx="0" dy="6.144" stdDeviation="10.24" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="71.68" ry="71.68" fill="url(#bg512)"/>

  <!-- Subtle gradient overlay -->
  <rect width="512" height="512" rx="71.68" ry="71.68"
    fill="rgba(255,255,255,0.04)"/>

  <!-- Glow ring behind star -->
  <circle cx="256.0" cy="194.56" r="164.864"
    fill="rgba(77,201,90,0.12)"/>

  <!-- Star with glow -->
  <path d="M256.000,51.200 L289.104,148.996 L392.343,150.259 L309.564,211.964 L340.265,310.541 L256.000,250.880 L171.735,310.541 L202.436,211.964 L119.657,150.259 L222.896,148.996 Z"
    fill="url(#star512)"
    filter="url(#glow512)"
    opacity="0.97"/>

  <!-- VCG text -->
  <text
    x="256.0"
    y="419.84"
    font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
    font-size="112.64"
    font-weight="900"
    letter-spacing="4.096"
    text-anchor="middle"
    fill="#ffffff"
    filter="url(#shadow512)"
    opacity="0.97">VCG</text>

  <!-- Bottom label (only for larger sizes) -->
  <text x="256.0" y="486.4"
    font-family="Arial, sans-serif"
    font-size="33.28"
    font-weight="600"
    letter-spacing="9.216"
    text-anchor="middle"
    fill="#4dc95a"
    opacity="0.75">SYRIAN</text>
</svg>