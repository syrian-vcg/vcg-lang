<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a0a"/>
      <stop offset="100%" stop-color="#2d5a1b"/>
    </linearGradient>
    <linearGradient id="star256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f5e0"/>
    </linearGradient>
    <filter id="glow256" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow256">
      <feDropShadow dx="0" dy="3.072" stdDeviation="5.12" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="35.84" ry="35.84" fill="url(#bg256)"/>

  <!-- Subtle gradient overlay -->
  <rect width="256" height="256" rx="35.84" ry="35.84"
    fill="rgba(255,255,255,0.04)"/>

  <!-- Glow ring behind star -->
  <circle cx="128.0" cy="97.28" r="82.432"
    fill="rgba(77,201,90,0.12)"/>

  <!-- Star with glow -->
  <path d="M128.000,25.600 L144.552,74.498 L196.172,75.130 L154.782,105.982 L170.132,155.270 L128.000,125.440 L85.868,155.270 L101.218,105.982 L59.828,75.130 L111.448,74.498 Z"
    fill="url(#star256)"
    filter="url(#glow256)"
    opacity="0.97"/>

  <!-- VCG text -->
  <text
    x="128.0"
    y="209.92"
    font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
    font-size="56.32"
    font-weight="900"
    letter-spacing="2.048"
    text-anchor="middle"
    fill="#ffffff"
    filter="url(#shadow256)"
    opacity="0.97">VCG</text>

  <!-- Bottom label (only for larger sizes) -->
  <text x="128.0" y="243.2"
    font-family="Arial, sans-serif"
    font-size="16.64"
    font-weight="600"
    letter-spacing="4.608"
    text-anchor="middle"
    fill="#4dc95a"
    opacity="0.75">SYRIAN</text>
</svg>