plugins {
    id 'com.android.application'
}

// ════════════════════════════════════════════════════════════════
// أسرار AdMob — تُقرأ من local.properties (هذا الملف غير مرفوع على
// GitHub بسبب .gitignore) فلا تُكتب أي مفاتيح إعلانية حقيقية مباشرة
// في الكود المصدري العام. إن لم يوجد الملف أو المفتاح، نستخدم أرقام
// AdMob الرسمية للاختبار (Test IDs) ليبقى المشروع قابلاً للبناء فوراً
// لأي شخص يستنسخه من GitHub دون أن يعرض حساب AdMob الحقيقي للخطر.
// ════════════════════════════════════════════════════════════════
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def admobAppId = localProps.getProperty('ADMOB_APP_ID', 'ca-app-pub-3940256099942544~3347511713')
def admobRewardedUnitId = localProps.getProperty('ADMOB_REWARDED_UNIT_ID', 'ca-app-pub-3940256099942544/5224354917')
def admobInterstitialUnitId = localProps.getProperty('ADMOB_INTERSTITIAL_UNIT_ID', 'ca-app-pub-3940256099942544/1033173712')
def admobBannerUnitId = localProps.getProperty('ADMOB_BANNER_UNIT_ID', 'ca-app-pub-3940256099942544/6300978111')
def admobRewardedInterstitialUnitId = localProps.getProperty('ADMOB_REWARDED_INTERSTITIAL_UNIT_ID', 'ca-app-pub-3940256099942544/5354046379')

android {
    namespace 'com.syrianvcg.editor'
    compileSdk 34

    defaultConfig {
        applicationId "com.syrianvcg.editor"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders += [admobAppId: admobAppId]
        buildConfigField "String", "ADMOB_APP_ID", "\"${admobAppId}\""
        buildConfigField "String", "ADMOB_REWARDED_UNIT_ID", "\"${admobRewardedUnitId}\""
        buildConfigField "String", "ADMOB_INTERSTITIAL_UNIT_ID", "\"${admobInterstitialUnitId}\""
        buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"${admobBannerUnitId}\""
        buildConfigField "String", "ADMOB_REWARDED_INTERSTITIAL_UNIT_ID", "\"${admobRewardedInterstitialUnitId}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // ════════════════════════════════════════════════════════════════
    // Lint: تقرير دون إيقاف البناء. لا نريد أن يفشل CI/CD بسبب أخطاء
    // أو تحذيرات lint غير حرجة — التقرير يبقى متاحاً لمراجعته يدوياً.
    // ════════════════════════════════════════════════════════════════
    lint {
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
    }
}

dependencies {
    // ── VCG Language SDK (حزمة لغة VCG) ──────────────────────────────────────
    // تُحمَّل تلقائياً من مجلد libs — لا حاجة لإعدادات إضافية
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.13.1'

    // Activity Result API — يشمل PickVisualMedia (Photo Picker API 33+)
    // مع fallback تلقائي عبر Google Play Services على الأجهزة الأقدم (Android 11-12)
    implementation 'androidx.activity:activity:1.9.0'

    // Crypto
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
